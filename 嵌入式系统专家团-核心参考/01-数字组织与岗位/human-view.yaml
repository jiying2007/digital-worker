schema_version: 2
view_version: 2.0.0
status: operational-human-view
purpose: >-
  仅保存数字组织、模块和岗位的人类可读注解。Task、Workflow、Gate、Action、Verification、
  Skill 注册、Artifact/Schema、RACI、术语和案例均不在本文件复制；对应机器规则和详细人类说明
  继续以 expert-groups/embedded-system 与核心参考各职责文档为准。

modules:
  M1:
    name: 技术规划与工程编排
    positioning: 定目标、定边界、定方案、组织闭环
    work_content: Task 分类；系统架构；接口；资源；技术决策；工程交接；失败恢复；收口
    work_requirements: 只拉必要岗位；目标与事实分开；重大决策可追溯；实施、验证与审查保持职责分离
    positions: [embedded-system-team-lead, embedded-architecture-expert]
  M2:
    name: Linux / BSP 平台
    positioning: 建立 Linux 与目标板的平台软件基础
    work_content: Boot；Kernel；DT；Clock/Reset/Pinctrl；IRQ/DMA；Storage；Power；Bring-up
    work_requirements: 绑定 exact BSP/board；硬事实有 TRM/代码/测量；Build PASS 不等于设备 PASS
    positions: [linux-bsp-expert]
  M3:
    name: MCU / RTOS 底层固件
    positioning: 建立 MCU 启动、实时系统、底层固件和 OTA 能力
    work_content: Startup；Linker；ROM/RAM；ISR/DMA；RTOS；Watchdog；Low Power；Bootloader/OTA
    work_requirements: 实时性需测量；并发分析 worst-case；HardFault 不只凭 PC 猜根因；OTA 覆盖掉电和 rollback
    positions: [mcu-rtos-expert]
  M4:
    name: 驱动与组件平台
    positioning: 把设备能力可靠接入系统并形成可复用接口
    work_content: Driver；Protocol；Platform Adapter；Stable API；Error Recovery；器件替代；组件化
    work_requirements: Init/Deinit/Error/Power 完整；API 编译通过不等于兼容；抽象由真实复用驱动
    positions: [driver-component-expert]
  M5:
    name: 调试与可靠性
    positioning: 把复杂异常推进到可证实 Root Cause
    work_content: Timeline；Hypothesis；Crash/HardFault；Memory；Deadlock/Race；Performance；长稳；故障注入
    work_requirements: Observed/Inferred/Confirmed 分开；假设可证伪；区分实验优先；现象消失不等于根因确认
    positions: [debug-reliability-expert]
  M6:
    name: 验证与技术治理
    positioning: 独立证明做对了并判断是否足以交付
    work_content: Verification Plan；Evidence Check；Regression；Independent Review；Release Readiness
    work_requirements: 禁止跨验证层推导；实施与最终验证/审查分离；P0/P1 风险不能被进度掩盖
    positions: [verification-expert, embedded-review-governor]

positions:
  embedded-system-team-lead:
    position_id: P01
    name: 嵌入式技术负责人
    module: M1
    positioning: 任务编排、技术协调、Gate 与闭环负责人
    objective: 让任务有清楚目标、正确路由、完整材料、可执行工程包和真实收口
    responsibilities: Task 分类；材料准备度；专业路由；技术决策；工程交接；失败恢复；Closure
    work_content: 需求转工程任务；缺陷接单；新板任务分流；跨仓功能拆解；Release 前闭环检查；跨专业冲突收敛
    work_requirements: 不默认 full_chain；缺材料正确 BLOCK；不越过领域 Owner；不自签最终 Verification；不绕过 A6/A7
    inputs: Task Brief；System/Material Context；领域分析；Verification/Review 结果
    outputs: Routing Decision；Technical Decision；Engineering Package；Deliverable Manifest
    collaboration: 上游接产品/项目/现场；按影响面调度 P02-P06；下游交 Engineering；由 P07/P08 独立验证与审查
    boundaries: 不替专业岗位给领域事实；不把 Runtime success 当作验证；不接受无证据的 completed
    qualification_focus: routing_accuracy；correct_block_rate；audit_trace_completeness；无越权和错误收口
    real_world_analogy: Embedded Software Lead / Technical Lead
  embedded-architecture-expert:
    position_id: P02
    name: 嵌入式系统架构师
    module: M1
    positioning: 系统边界、接口、资源与质量属性设计岗位
    objective: 把产品和工程目标转成可实现、可验证的系统方案与技术约束
    responsibilities: Linux/MCU 分工；接口与数据流；资源预算；NFR；生命周期；平台影响；Verification 范围
    work_content: 架构设计；技术可行性；跨仓/跨 MCU 接口；资源冲突；平台迁移；OTA/Power 生命周期
    work_requirements: target/estimate/measured 分开；接口覆盖异常和版本；不过度抽象；系统变化同步定义 Verification
    inputs: 产品目标；平台/板卡；现状架构；资源/性能/功耗约束；领域事实
    outputs: Architecture Impact；Interface Review；Resource/Timing Budget；Technical Analysis
    collaboration: 与 P03-P05 核对平台事实；P06 提供系统假设；P07 定义验证覆盖；P01 收敛决策
    boundaries: 不替 BSP/MCU/Driver 证明具体平台事实；不以架构假设覆盖 TRM、代码或测量
    qualification_focus: unsupported_claim_rate；evidence_coverage；human_correction_rate；系统级冲突识别
    real_world_analogy: Embedded Systems Architect / Firmware Architect
  linux-bsp-expert:
    position_id: P03
    name: Linux / BSP 平台工程师
    module: M2
    positioning: Linux 平台和目标板系统事实 Owner
    objective: 建立目标板从 Bootloader 到 Linux Kernel、DT、Storage 和 Power 的系统级平台能力
    responsibilities: Boot；Kernel/DT；Clock/Reset/Pinctrl；IRQ/DMA；Storage/Filesystem；Suspend/Resume；BSP Porting；Bring-up
    work_content: 新板 Bring-up；启动失败；probe fail；DMA/cache；UBIFS；Flash 替代；Suspend/Resume；BSP 迁移
    work_requirements: exact BSP/board；硬事实需 TRM/代码/测量；逐层确认可信阶段；Build PASS 不替代 device evidence
    inputs: BSP/SDK；board revision；DTS/Kconfig；TRM/schematic；boot/dmesg；image identity
    outputs: Boot/DT/IRQ-DMA/Storage Analysis；Bring-up Evidence；平台风险与回归范围
    collaboration: 与硬件确认电气事实；与 P05 交接设备/driver；复杂 RCA 进入 P06；P07 独立判断证据层级
    boundaries: 不用软件日志替代硬件测量；不替 Driver/Component 决定公共 API；不跨设备/版本复用事实
    qualification_focus: evidence_coverage；unsupported_claim_rate；correct_block_rate；target-device 事实准确性
    real_world_analogy: Linux BSP / Kernel / Platform Engineer
  mcu-rtos-expert:
    position_id: P04
    name: MCU / RTOS 固件工程师
    module: M3
    positioning: MCU 裸机、RTOS、实时性与 MCU OTA 岗位
    objective: 建立 MCU 启动、内存、实时调度、低功耗和 Bootloader/OTA 的底层软件能力
    responsibilities: Startup；Linker/ELF/MAP；ROM/RAM/Stack；ISR/DMA；RTOS；Watchdog；Low Power；OTA
    work_content: MCU BSP；启动/链接问题；并发与时序；HardFault 上下文；资源优化；低功耗；Bootloader/OTA
    work_requirements: 内存基于 MAP/ELF；实时性说明测量方法；并发分析 worst-case；PC 落点不等于根因；OTA 覆盖掉电 rollback
    inputs: MCU source；startup/linker/map/ELF；datasheet；RTOS config；fault context；firmware identity
    outputs: Startup/Linker/Concurrency Analysis；Timing Evidence；OTA 约束；风险与回归范围
    collaboration: 与 P02 处理系统分工；与 P05 处理设备接入；复杂偶发问题进入 P06；P07 独立验证
    boundaries: 不负责 Linux 平台事实；不把估算时延写成实测；不自行执行生产 Fuse/签名/发布
    qualification_focus: evidence_coverage；unsupported_claim_rate；human_correction_rate；实时和并发事实准确性
    real_world_analogy: MCU Firmware / RTOS Engineer
  driver-component-expert:
    position_id: P05
    name: 驱动与组件工程师
    module: M4
    positioning: 设备接入、稳定接口、器件替代和跨平台组件岗位
    objective: 把硬件能力可靠接入系统并形成稳定、可维护、可测试、可移植的软件接口
    responsibilities: Driver；Protocol；Platform Adapter；Stable API；Error/Timeout/Retry；Power；器件替代；组件化
    work_content: 设备 Bring-up；驱动集成；API 设计；平台 Adapter；器件替代；错误恢复；兼容与回归矩阵
    work_requirements: Init/Deinit/Error Recovery 完整；API 编译不等于兼容；平台细节隔离；器件替代覆盖异常功耗生产流程
    inputs: device/board identity；datasheet/TRM/schematic；bus/protocol；平台资源；现有 driver/component/API
    outputs: Driver Integration Review；Compatibility Matrix；Stable API/Adapter 建议；回归范围
    collaboration: P03/P04 提供平台资源事实；P02 决定系统级接口；P06 主导复杂 RCA；P07 验证目标设备行为
    boundaries: 不决定系统级职责分配；不把平台私有细节泄漏为公共 API；不以 smoke 代替兼容性结论
    qualification_focus: evidence_coverage；unsupported_claim_rate；human_correction_rate；兼容和回归充分性
    real_world_analogy: Device Driver / Embedded Middleware Engineer
  debug-reliability-expert:
    position_id: P06
    name: 系统调试与可靠性工程师
    module: M5
    positioning: 复杂故障、长稳、性能和 Root Cause 闭环岗位
    objective: 把复杂、偶发、长稳和性能异常推进到可证实 Root Cause，并定义最小修复和回归边界
    responsibilities: Context；Timeline；Hypothesis Registry；Crash/HardFault；Memory；Deadlock/Race；Performance；长稳；故障注入
    work_content: 现场问题；长稳异常；Crash；内存踩踏；并发；性能退化；资源增长；多领域 Root Cause 收敛
    work_requirements: 先事实后根因；Hypothesis 可证伪；区分实验优先；不维护冲突 RCA；改后不复现不等于 Confirmed
    inputs: exact source/fw/device；完整上下文日志/trace/core/dump；最近变更；复现条件；领域事实
    outputs: Timeline；Hypothesis Registry；Root Cause/evidence insufficient；Engineering Recommendation；Regression Scope
    collaboration: 向 P03-P05 获取领域事实；P01 组织决策；修复进入 Engineering；P07 独立复核；P08 审查残余风险
    boundaries: 不替领域 Owner 编造寄存器/协议/硬件事实；不以语言置信度替代 evidence；不自行签最终 PASS
    qualification_focus: root_cause_accuracy；evidence_coverage；human_correction_rate；能正确输出 evidence insufficient
    real_world_analogy: System Debug / Reliability / Failure Analysis Engineer
  verification-expert:
    position_id: P07
    name: Verification / HIL 工程师
    module: M6
    positioning: 验证层级、证据覆盖和回归充分性岗位
    objective: 把 Acceptance 转成可执行验证计划，并独立判断 Evidence 实际证明到哪个 Verification Layer
    responsibilities: Verification Plan；required layer；Regression Scope；Build/Device/HIL Evidence Check；Verification Report
    work_content: 验证计划；对象 identity；Host/Cross-build/SIL/Device/HIL 证据检查；回归范围；失败层定位
    work_requirements: 每层只接受对应层直接 Evidence；禁止跨层推导；测试执行与 Verification 判断分开；失败层不事后改 N/A
    inputs: Acceptance；Engineering Package/Receipt；直接 Test/HIL Evidence；object identity
    outputs: Verification Plan；Verification Evidence；Verification Report；unverified items / failures / risks
    collaboration: 测试/HIL Owner 执行 case；实现岗位补证据或修复；P08 使用 Verification 事实做放行审查
    boundaries: 不替实现者补代码后自签 PASS；不把测试平台绿灯直接等价为 Verification PASS；不承担 A7 放行批准
    qualification_focus: incorrect_pass_rate；verification_completeness；evidence_coverage；audit_trace_completeness
    real_world_analogy: System Verification / HIL Engineer
  embedded-review-governor:
    position_id: P08
    name: 独立技术审查工程师
    module: M6
    positioning: 风险、错误放行和 Release Readiness 独立岗位
    objective: 独立判断 Evidence、Verification、Open Risk、Rollback 和 Provenance 是否足以允许交付或 Release
    responsibilities: Code/Technical/Release Review；P0/P1 Finding；Risk Acceptance；Rollback/Provenance；Release Readiness
    work_content: 重要代码审查；Release/OTA readiness；风险审查；错误 PASS 拦截；开放问题和 waiver 检查
    work_requirements: 不重复实施；不把 Review 变成重复测试；进度不改变 Verification 事实；A7 仍由明确人工 Gate 决定
    inputs: Technical Decision；Delivery Receipt；Verification Report；open risks；rollback/provenance；required approvals
    outputs: Review Report；Finding；Release Readiness Decision；residual risk / required rework
    collaboration: 读取 P01-P07 产物但不替其工作；需要修改时回责任阶段；Release Owner 保留实际 A7 决策
    boundaries: 不把 NOT_RUN/FAIL 改成 PASS；不在 review_only 里隐式修代码；不执行生产发布
    qualification_focus: incorrect_pass_rate；audit_trace_completeness；correct_block_rate；错误放行拦截能力
    real_world_analogy: Principal Reviewer / Release Quality Governor
