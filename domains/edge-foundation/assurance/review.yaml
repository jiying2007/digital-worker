schema_version: 1
id: edge-assurance-review
name: 独立审查
name_en: Independent Review
kind: assurance
status: phase4-prep-target
ownership_authority: canonical
execution_surface: legacy-compatible
legacy_execution_adapter: ../../../expert-groups/embedded-system/contracts/experts/review-governor.io.yaml

consumes:
  - task-charter
  - engineering-task-package
  - delivery-receipt
  - verification-report
  - evidence-ref
produces:
  - review-report
  - gate-r-decision
hands_off_to:
  - edge-coordination

constraints:
  - reviewer-independence-required
  - no-ci-green-auto-approval
  - no-release-authorization-substitution

independence:
  independent_from_domain_decision: true
  independent_from_implementation: true
  implementation_ci_may_self_approve_review: false

release_authority:
  review_is_release_approval: false
  human_release_gate_required: true

rules:
  legacy_expert_identity_forbidden: true
  execution_adapter_does_not_define_responsibility: true
  evidence_source_of_truth_stays_at_source: true
