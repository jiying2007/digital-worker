schema_version: 1
id: edge-coordination
name: 端侧协调角色
name_en: Edge Coordination Role
kind: role
status: phase4-prep-target
ownership_authority: canonical
execution_surface: legacy-compatible
legacy_execution_adapter: ../../expert-groups/embedded-system/contracts/experts/team-lead.io.yaml

consumes:
  - task-brief
  - knowledge-and-material-evidence
  - domain-expert-artifacts
  - delivery-receipt-when-executed
  - verification-report-when-required
  - review-report-when-required
produces:
  - task-charter
  - team-run-state
  - gate-ledger
  - routing-decision
  - technical-decision
produces_when_applicable:
  engineering_execution:
    - engineering-task-package
  closure:
    - deliverable-manifest

hands_off_to:
  - embedded-system-expert
  - assurance.verification
  - assurance.review

constraints:
  - no-domain-conclusion-substitution
  - no-self-final-verification
  - no-implicit-full-chain
  - workflow-mode-controls-applicable-stages

responsibilities:
  - intake
  - triage
  - domain-routing
  - cross-domain-synthesis
  - conflict-resolution
  - closure

rules:
  legacy_expert_identity_forbidden: true
  coordination_is_not_domain_expert: true
  coordination_is_not_agent: true
  domain_conclusion_substitution_forbidden: true
  implementation_verification_review_separation_required: true
  execution_adapter_does_not_define_responsibility: true
  embedded_capability_routing_internal_to_embedded_expert: true
