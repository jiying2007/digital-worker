schema_version: 1
id: edge-foundation-skill-registry
status: target-v1
ownership_authority: canonical
execution_surface: target

rules:
  skill_count_is_not_architecture: true
  legacy_expert_identity_as_owner_forbidden: true
  capability_is_not_agent: true
  assurance_is_independent_from_execution: true
  physical_skill_location_is_canonical: true
  skill_frontmatter_owner_must_match_registry: true
  unregistered_skill_invocation_forbidden: true
  max_default_action_level: A2_GENERATE

skills:
  - {id: embedded-task-classifier, owner_kind: role, owner_id: edge-coordination, path: skills/embedded-task-classifier/SKILL.md}
