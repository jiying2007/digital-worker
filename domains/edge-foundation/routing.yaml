schema_version: 1
id: edge-foundation-routing-v1
status: canonical
canonical_routing: true
runtime_policy: runtime/task-modes.yaml

policy:
  unmapped_task_type: BLOCKED
  unknown_capability: BLOCKED
  cross_domain_expansion_requires_evidence: true
  action_authority_must_follow_runtime_policy: true

routing:
  feature_development:
    target_mode: single_domain
    primary_experts: [embedded-system-expert]
    capabilities: [embedded.architecture, embedded.driver-component, embedded.mcu-rtos, embedded.linux-bsp]
    assurance: [verification]
  defect_debugging:
    target_mode: diagnostic
    primary_experts: [embedded-system-expert]
    capabilities: [embedded.debug-reliability]
    capability_expansion: evidence-driven
    assurance: [verification]
  architecture_design:
    target_mode: single_domain
    allowed_target_modes: [single_domain, review]
    primary_experts: [embedded-system-expert]
    capabilities: [embedded.architecture]
    assurance: [verification]
  technical_feasibility_review:
    target_mode: review
    primary_experts: [embedded-system-expert]
    capabilities: [embedded.architecture]
    assurance: [review]
  platform_bringup:
    target_mode: single_domain
    primary_experts: [embedded-system-expert]
    capabilities: [embedded.linux-bsp, embedded.mcu-rtos, embedded.driver-component]
    assurance: [verification]
    cross_domain_escalation:
      possible_mode: multi_domain
      possible_experts: [hardware-expert, embedded-system-expert]
      triggers: [board-electrical-state-uncertain, schematic-or-power-sequence-discrepancy, peripheral-electrical-interface-uncertain]
  bsp_porting:
    target_mode: single_domain
    primary_experts: [embedded-system-expert]
    capabilities: [embedded.linux-bsp]
    assurance: [verification]
  driver_development:
    target_mode: single_domain
    primary_experts: [embedded-system-expert]
    capabilities: [embedded.driver-component, embedded.linux-bsp]
    assurance: [verification]
    cross_domain_escalation:
      possible_mode: multi_domain
      possible_experts: [hardware-expert, embedded-system-expert]
      triggers: [schematic-or-electrical-contract-missing, signal-integrity-or-power-cause-suspected]
  component_development:
    target_mode: single_domain
    primary_experts: [embedded-system-expert]
    capabilities: [embedded.driver-component, embedded.architecture]
    assurance: [verification]
  mcu_firmware_development:
    target_mode: single_domain
    primary_experts: [embedded-system-expert]
    capabilities: [embedded.mcu-rtos]
    assurance: [verification]
  performance_optimization:
    target_mode: single_domain
    allowed_target_modes: [single_domain, diagnostic]
    primary_experts: [embedded-system-expert]
    capabilities: [embedded.debug-reliability, embedded.architecture]
    assurance: [verification]
  stability_reliability:
    target_mode: diagnostic
    primary_experts: [embedded-system-expert]
    capabilities: [embedded.debug-reliability]
    assurance: [verification]
  code_review:
    target_mode: review
    primary_experts: [embedded-system-expert]
    capabilities: []
    assurance: [review]
    execution_forbidden: true
  release_ota:
    target_mode: review
    primary_experts: [embedded-system-expert]
    capabilities: []
    assurance: [verification, review]
    release_action_requires_human_approval: true
  field_incident:
    target_mode: diagnostic
    primary_experts: [embedded-system-expert]
    capabilities: [embedded.debug-reliability]
    capability_expansion: evidence-driven
    assurance: [verification]

runtime_mode_to_responsibility_mode:
  full_chain: single_domain
  short_chain: single_domain
  diagnostic_chain: diagnostic
  bringup_chain: single_domain
  review_only: review
  release_chain: review
  single_expert: single_domain

rules:
  task_type_set_must_match_runtime_policy: true
  primary_experts_must_exist_in_domain_contract: true
  capabilities_must_exist_in_owner_expert: true
  diagnostic_mode_must_remain_diagnostic: true
  review_and_release_modes_must_remain_review: true
  legacy_expert_identity_forbidden: true
