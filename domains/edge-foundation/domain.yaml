schema_version: 1
id: edge-foundation
name: 端侧底座领域
name_en: Edge Foundation Domain
status: target-v1
architecture_model: provider-neutral
responsibility_model: contract-first
runtime_topology: not_frozen

canonical_adr: ../../docs/adr/ADR-004-edge-foundation-digital-responsibility-architecture.md
source_material: ../../docs/source-materials/端侧底座专家团创建.docx

orchestration:
  name: 编排平面
  name_en: Orchestration Plane
  provider_binding: not_frozen
  implementation_binding: not_frozen
  responsibilities:
    - domain-routing
    - state-management
    - gate-control
    - context-selection
    - budget-control
    - retry-resume
    - escalation
  forbidden_assumptions:
    - workbuddy-is-required
    - one-expert-equals-one-agent
    - capability-equals-agent

coordination_role:
  id: edge-coordination
  name: 端侧协调角色
  name_en: Edge Coordination Role
  type: role
  is_domain_expert: false
  responsibilities:
    - intake
    - triage
    - domain-routing
    - cross-domain-synthesis
    - conflict-resolution
    - closure
  runtime_binding: not_frozen

experts:
  - id: structure-expert
    name: 结构专家
    name_en: Structure Expert
    responsibility: structure
  - id: hardware-expert
    name: 硬件专家
    name_en: Hardware Expert
    responsibility: hardware
  - id: embedded-system-expert
    name: 嵌入式系统专家
    name_en: Embedded System Expert
    responsibility: embedded-system
    capabilities:
      - embedded.architecture
      - embedded.linux-bsp
      - embedded.mcu-rtos
      - embedded.driver-component
      - embedded.debug-reliability

capability_policy:
  capability_is_agent: false
  default_growth: capability_or_skill
  expert_promotion_requires_adr: true
  expert_promotion_criteria:
    - independent-responsibility-boundary
    - independent-task-entry
    - independent-lifecycle
    - independent-core-deliverables
    - independent-knowledge-domain
    - substantial-stable-skills
    - recurring-direct-routing
    - explicit-cross-expert-io-contract

execution:
  name: 执行平面
  name_en: Execution Plane
  runtime_binding: not_frozen
  allowed_implementations:
    - engineer
    - engineering-agent-runtime
    - codex
    - adk
    - ide-agent
    - ci
    - hil
    - script
    - device
    - other
  responsibility_separation_required: true

assurance:
  name: 可信保障平面
  name_en: Assurance Plane
  independent_from_execution: true
  responsibilities:
    verification:
      name: 验证
      name_en: Verification
      self_approval_by_implementation: false
    review:
      name: 独立审查
      name_en: Independent Review
      independent_from_domain_decision_and_execution: true
    evidence:
      name: 证据
      name_en: Evidence
      source_of_truth_stays_at_source: true
    evaluation:
      name: 评测
      name_en: Evaluation

workflow_semantics:
  frozen_high_level_modes:
    - single_domain
    - multi_domain
    - diagnostic
    - review
  concrete_workflows_not_frozen: true
  minimal_required_path: true

cross_domain_collaboration:
  model: claim-evidence-driven
  shared_objects:
    - claim
    - hypothesis
    - evidence
    - finding
    - decision
    - verification
    - closure
  fact_states:
    - observed
    - inferred
    - confirmed

knowledge:
  source_of_truth_policy: stays_at_source
  knowledge_provider_binding: not_frozen
  canonical_source_examples:
    - git
    - issue-pr
    - ci
    - artifact-store
    - hil
    - datasheet-trm
    - schematic
    - measurement
    - collaboration-docs

legacy_compatibility:
  embedded_system_surface: ../../expert-groups/embedded-system/expert-group.yaml
  mapping: compatibility/embedded-1plus7-mapping.yaml
  mode: shadow
  canonical_new_responsibility_model: true
  legacy_machine_contract_preserved: true
  direct_big_bang_removal_forbidden: true
  migration_phase: phase-2-dual-evaluation
  shadow_routing: routing-shadow.yaml
  shadow_evaluator: ../../scripts/evaluate_edge_foundation_shadow.py
  pilot_shadow_evaluator: ../../scripts/evaluate_edge_foundation_pilot_shadow.py
  pilot_shadow_receipt_schema: ../../schemas/edge-foundation-shadow-receipt.v1.schema.json
  phase3_readiness_evaluator: ../../scripts/evaluate_edge_foundation_phase3_readiness.py
  phase3_readiness_schema: ../../schemas/edge-foundation-phase3-readiness.v1.schema.json
  phase3_review_package_generator: ../../scripts/generate_edge_foundation_phase3_review_package.py
  phase3_review_package_schema: ../../schemas/edge-foundation-phase3-review-package.v1.schema.json
  canonical_switch_dry_run_policy: canonical-switch-dry-run.yaml
  canonical_switch_plan_generator: ../../scripts/generate_edge_foundation_canonical_switch_plan.py
  canonical_switch_plan_schema: ../../schemas/edge-foundation-canonical-switch-plan.v1.schema.json
  phase3_promotion_gate_source: ../../expert-groups/embedded-system/pilot/pilot-plan.yaml
  phase3_evidence_requires_real_pilot: true
  synthetic_pilot_must_not_count_for_phase3: true
  phase3_readiness_requires_separate_review: true
  phase3_review_package_auto_apply_forbidden: true
  canonical_switch_dry_run_must_not_apply: true
  phase4_deprecation_must_be_separate_from_phase3: true
  phase5_removal_must_be_separate_from_phase3: true
  automatic_canonical_switch_forbidden: true
  canonical_routing_switched: false
