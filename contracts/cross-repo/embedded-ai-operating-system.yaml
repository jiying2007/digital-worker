schema_version: 3
status: current-stage-baseline
architecture_provider_selection: not_frozen
architecture_model: four-control-planes-plus-replaceable-runtime-bindings

planes:
  digital-worker:
    role: rd-operating-model
    owns:
      - work-item-and-run
      - expert-identity-and-routing
      - domain-workflow-and-gates
      - action-policy
      - technical-decision
      - engineering-handoff
      - engineering-identity-thread
      - verification
      - independent-review
      - domain-pilot-and-maturity
    must_not_own:
      - general-knowledge-lifecycle-engine
      - runtime-specific-agent-exporters
      - external-practice-adoption-lab
      - runtime-host-configuration

  knowledge-hub:
    role: knowledge-control-plane
    owns:
      - knowledge-registry
      - knowledge-context-and-evidence-pack
      - knowledge-lifecycle
      - owner-review-and-promotion
      - compatibility-intelligence
    access: adapter-only
    write_from_digital_worker: proposal-only

  agent-dev-kit:
    role: agent-asset-control-plane
    owns:
      - reusable-agent-assets
      - reusable-skills
      - asset-profiles
      - workflow-assets
      - immutable-release-identity
      - exact-source-set-handoff-contract
      - asset-evaluation-and-release
    required_profile: embedded-fullstack
    must_not_own:
      - runtime-distribution-assembly
      - runtime-live-home
      - domain-verification-pass

  llm_agent:
    role: practice-and-runtime-evaluation-lab
    owns:
      - external-practice-intake
      - adoption-evidence
      - runtime-target-health
      - cross-runtime-comparison-evidence
      - loop-readiness-evaluation
    must_not_own:
      - production-runtime
      - domain-verification-pass

runtime_bindings:
  contract:
    purpose: select exact provider source assets and assemble one concrete runtime/host distribution without changing domain semantics
    required_identity:
      - runtime-binding-repository
      - runtime-binding-commit
      - runtime-target
      - runtime-profile
      - runtime-host
      - source-set-identity-ref
      - runtime-distribution-identity-ref
      - session-bootstrap-ref
      - execution-receipt-ref
    owns:
      - exact-source-selection
      - runtime-profile
      - runtime-host-mapping
      - runtime-distribution-assembly
      - session-bootstrap
      - runtime-execution-receipt
    must_not_own:
      - domain-gate-semantics
      - domain-verification-pass
      - knowledge-lifecycle
      - reusable-agent-skill-source-of-truth
      - cross-runtime-effectiveness-evaluation
  candidates:
    codex:
      repository: jiying2007/codex
      role: codex-runtime-distribution-and-host-integration
      runtime_target: codex-cli
      status: source-set-bound
      session_bootstrap: active
    claude-code:
      repository: null
      role: future-runtime-binding
      runtime_target: claude-code
      status: future

source_fact_planes:
  git_ci_hil_artifact_store:
    owns:
      - source-sha
      - build-identity
      - artifact-hash
      - device-and-test-facts
      - release-facts

handoffs:
  - from: digital-worker
    to: knowledge-hub
    contract: knowledge-context/evidence-pack/proposal-route
    failure: BLOCKED_or_NEEDS_REVIEW
  - from: digital-worker
    to: agent-dev-kit
    contract: asset-profile-plus-immutable-release-ref
    failure: BLOCKED
  - from: agent-dev-kit
    to: runtime-binding
    contract: immutable-release-plus-exact-source-set-handoff
    failure: BLOCKED_SOURCE_SET_IDENTITY
  - from: digital-worker
    to: runtime-binding
    contract: engineering-task-package-plus-runtime-binding-request
    failure: BLOCKED
  - from: runtime-binding
    to: digital-worker
    contract: source-set/distribution/session-bootstrap/runtime-execution-receipt
    failure: BLOCKED_or_FAILED
  - from: runtime-binding
    to: llm_agent
    contract: runtime-health-and-comparison-evidence
    failure: NOT_READY_or_BLOCKED

stable_principles:
  - Provider 可替换，Contract 稳定
  - Source of Truth stays at source
  - Expert identity 与 Runtime 解耦
  - Asset Profile 与 Runtime Profile 分离
  - ADK immutable release 与 Runtime exact source-set/distribution identity 分层
  - Session Bootstrap 是 Runtime Binding 内的薄装配层，不是第五控制面
  - Runtime local gate 不等于 Domain Gate
  - Runtime output 不等于 Verification PASS
  - Knowledge candidate 不自动 promotion active
