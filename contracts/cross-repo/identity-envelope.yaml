schema_version: 3
status: current-stage-baseline
purpose: refs-first identity spine across Digital Worker governance, workflow, knowledge, immutable agent release, runtime source-set/distribution, runtime execution, engineering evidence and exact assurance decisions

required:
  work_item_id: string
  run_id: string

digital_worker_governance:
  provider: digital-worker
  repository: jiying2007/digital-worker
  provider_commit: null
  contract_catalog_ref: contracts/catalog.json
  contract_catalog_digest: null
  selected_domain_refs: []
  selected_routing_refs: []
  materially_used_domain_skills: []
  # selected refs remain refs-first. Typical items carry an authoritative ref plus an exact digest;
  # the envelope never copies Domain Contract / Skill bodies into a second SSOT.

knowledge_context:
