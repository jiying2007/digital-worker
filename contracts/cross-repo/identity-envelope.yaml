schema_version: 3
status: current-stage-baseline
purpose: refs-first identity spine across workflow, knowledge, immutable agent release, runtime source-set/distribution, runtime execution and engineering evidence

required:
  work_item_id: string
  run_id: string

knowledge_context:
  provider: knowledge-hub
  source_fingerprint: null
  evidence_pack_ref: null
  knowledge_ids: []
  provider_commit: null
  provider_contract_digest: null

agent_assets:
  provider: agent-dev-kit
  provider_contract_commit: null
  release_identity:
    version: null
    tag: null
    commit: null
    tree: null
    manifest_blob: null
    release_artifact_sha256: null
  asset_profiles: []
  source_set_ref: null

runtime_binding:
  repository: null
  commit: null
  runtime_target: null
  runtime_profile: null
  runtime_host: null
  source_set_identity_ref: null
  runtime_distribution_identity_ref: null
  session_bootstrap_ref: null
  execution_receipt_ref: null

runtime_execution:
  provider: null
  runtime_version: null
  model: null
  model_provider: null
  mcp_fingerprint: null
  sandbox_identity: null
  approval_identity: null

runtime_evaluation:
  evaluator: llm_agent
  evaluator_commit: null
  comparison_evidence_ref: null

engineering:
  repositories: []
  # each: {repo_root, base_commit, result_commit}
  build_identity_ref: null
  artifact_hashes: []
  device_ids: []

verification:
  verification_run_id: null
  evidence_refs: []
  review_ref: null

rules:
  - refs point to authoritative source; envelope does not copy source facts into a second SSOT
  - exact provider, runtime-binding and source commits are required before claiming reproducibility
  - formal execution requires immutable ADK release identity plus exact Runtime source-set identity; a monolithic Runtime bundle is not required
  - when a Runtime Binding executes work, runtime distribution identity and execution receipt are required
  - asset_profile belongs to Agent Asset Control Plane and runtime_profile belongs to Runtime Binding; do not merge their semantics
  - L2 Formal Evidence requires exact-pinned Knowledge provider identity and contract digest
  - missing knowledge/asset/runtime-binding/source-set/distribution/runtime identity blocks cross-repo reproducibility claim
  - runtime execution receipt records execution facts only and must not contain verification_pass, release_ready or domain_gate_pass
  - runtime local conformance success never implies verification PASS
