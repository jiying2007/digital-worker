name: Embedded Expert Contracts

on:
  pull_request:
    paths:
      - 'README.md'
      - 'SKILLS.md'
      - '研发中心AI数字员工研发流程规划.md'
      - 'docs/**'
      - 'domains/**'
      - '嵌入式系统专家团-核心参考/**'
      - 'config/integrations/**'
      - 'contracts/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/branch-gc-allowlist.txt'
      - '.github/ISSUE_TEMPLATE/embedded-pilot.yml'
      - '.github/repository-governance-contract.json'
      - '.github/workflows/branch-gc.yml'
      - '.github/workflows/embedded-expert-contracts.yml'
      - '.github/workflows/repository-governance.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'SKILLS.md'
      - '研发中心AI数字员工研发流程规划.md'
      - 'docs/**'
      - 'domains/**'
      - '嵌入式系统专家团-核心参考/**'
      - 'config/integrations/**'
      - 'contracts/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/branch-gc-allowlist.txt'
      - '.github/ISSUE_TEMPLATE/embedded-pilot.yml'
      - '.github/repository-governance-contract.json'
      - '.github/workflows/branch-gc.yml'
      - '.github/workflows/embedded-expert-contracts.yml'
      - '.github/workflows/repository-governance.yml'

permissions:
  contents: read

concurrency:
  group: embedded-expert-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact validator dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3' 'jsonschema==4.26.0'
      - name: Validate repository layout
        run: python scripts/validate_repo_layout.py
      - name: Validate root SKILLS review index
        run: python scripts/validate_skills_overview.py
      - name: Validate provider-neutral architecture
        run: python scripts/validate_provider_neutral_architecture.py
      - name: Validate canonical Edge Foundation architecture
        run: python scripts/validate_edge_foundation_architecture.py
      - name: Validate canonical Edge Foundation target assets
        run: python scripts/validate_edge_foundation_target_assets.py
      - name: Validate Skill evaluation plan
        run: python scripts/validate_skill_evaluation_plan.py
      - name: Validate canonical routing
        run: python scripts/validate_edge_foundation_routing.py --output /tmp/edge-foundation-routing.json
      - name: Upload canonical routing receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edge-foundation-routing
          path: /tmp/edge-foundation-routing.json
          if-no-files-found: error
          retention-days: 14
      - name: Evaluate synthetic canonical Pilot receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_edge_foundation_pilot.py \
            tests/fixtures/pilot-run.valid.json \
            --pilot-result tests/fixtures/pilot-result.valid.json \
            --output /tmp/edge-foundation-pilot-receipt.json
          python - /tmp/edge-foundation-pilot-receipt.json <<'PY'
          import json, sys
          receipt = json.load(open(sys.argv[1], encoding='utf-8'))
          assert receipt['routing_authority'] == 'edge-foundation', receipt
          assert receipt['canonical_routing'] is True, receipt
          assert receipt['pilot_track'] == 'debug', receipt
          assert receipt['eligibility_checks']['source_real'] is False, receipt
          assert receipt['pilot_result_evaluated'] is True, receipt
          assert receipt['product_readiness_eligible'] is False, receipt
          assert 'synthetic-source-not-eligible' in receipt['eligibility_reasons'], receipt
          PY
      - name: Upload canonical Pilot receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edge-foundation-pilot-receipt
          path: /tmp/edge-foundation-pilot-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Prove product readiness stays blocked without all real Pilot tracks
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/synthetic-run"
          cp /tmp/edge-foundation-pilot-receipt.json "$root/synthetic-run/edge-foundation-pilot-receipt.json"
          set +e
          python scripts/evaluate_edge_foundation_product_readiness.py \
            --receipt-dir "$root" \
            --output /tmp/edge-foundation-product-readiness.json \
            --require-ready
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected product readiness without all real Pilot tracks to exit 2, got $status"
            exit 1
          fi
          python - /tmp/edge-foundation-product-readiness.json <<'PY'
          import json, sys
          readiness = json.load(open(sys.argv[1], encoding='utf-8'))
          assert readiness['status'] == 'BLOCKED', readiness
          assert readiness['eligible_for_product_review'] is False, readiness
          assert readiness['routing_authority'] == 'edge-foundation', readiness
          assert readiness['canonical_routing'] is True, readiness
          assert readiness['eligible_real_receipts'] == 0, readiness
          assert readiness['blockers'], readiness
          PY
      - name: Upload product-readiness receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edge-foundation-product-readiness
          path: /tmp/edge-foundation-product-readiness.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate core-reference synchronization
        run: python scripts/validate_core_reference.py
      - name: Validate zero live legacy references
        run: python scripts/validate_zero_live_legacy_refs.py
      - name: Validate Branch GC safety contract
        run: python scripts/validate_branch_gc.py
      - name: Validate Contract Catalog
        run: python scripts/validate_contract_catalog.py
      - name: Validate Embedded Domain Closed Loop V1
        run: python scripts/validate_embedded_closed_loop.py
      - name: Validate cross-repo AI operating system contract
        run: python scripts/validate_cross_repo_integration.py
      - name: Verify exact cross-repo checkouts and contract digests
        run: python scripts/verify_cross_repo_checkouts.py --root "$RUNNER_TEMP/dw-integrations" --fetch --output /tmp/cross-repo-verification.json
      - name: Upload cross-repo verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-repo-verification
          path: /tmp/cross-repo-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate Pilot operational contracts
        run: python scripts/validate_pilot_operations.py
      - name: Run trust regression tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Report live repository governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_repository_governance.py --report-only
      - name: Verify Knowledge Registry and adapter fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          python scripts/embedded_knowledge.py verify
          python scripts/embedded_knowledge.py query --text "debug evidence" --limit 5 --format json > /tmp/embedded-knowledge-query.json
          test -s /tmp/embedded-knowledge-query.json
          set +e
          python scripts/embedded_knowledge.py adapter-status > /tmp/embedded-knowledge-adapter-status.json
          status=$?
          set -e
          test "$status" -eq 2
          grep -q 'BLOCKED' /tmp/embedded-knowledge-adapter-status.json
      - name: Smoke canonical scaffold helper
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          python scripts/embedded_pilot.py init \
            --run-id CI-SCAFFOLD-001 \
            --track feature --source-type synthetic \
            --task-type feature_development --workflow-mode short_chain \
            --human-owner ci --task-brief tests/fixtures/task-brief.valid.json \
            --repo-root firmware/main --base-commit 0123456789abcdef0123456789abcdef01234567 \
            --output-root "$root"
          python scripts/embedded_pilot_scaffold.py "$root/CI-SCAFFOLD-001"
          test -f "$root/CI-SCAFFOLD-001/working/material-manifest.json"
          test -f "$root/CI-SCAFFOLD-001/working/acceptance-evidence-matrix.md"
          test -f "$root/CI-SCAFFOLD-001/working/knowledge-harvest.md"
      - name: Reject short SHA for real Pilot
        shell: bash
        run: |
          set +e
          python scripts/embedded_pilot.py init \
            --run-id CI-SHORT-SHA --track feature --source-type real \
            --task-type feature_development --workflow-mode short_chain \
            --human-owner ci --task-brief tests/fixtures/task-brief.valid.json \
            --repo-root firmware/main --base-commit 0123456 --output-root "$(mktemp -d)"
          status=$?
          set -e
          test "$status" -ne 0
      - name: Evaluate synthetic Pilot fixture
        run: python scripts/evaluate_embedded_pilot.py tests/fixtures/pilot-result.valid.json --output /tmp/pilot-metrics.json --markdown-output /tmp/pilot-metrics.md
      - name: Prove incorrect PASS is fail-closed
        shell: bash
        run: |
          set +e
          python scripts/evaluate_embedded_pilot.py tests/fixtures/pilot-result.incorrect-pass.json --fail-on-safety
          status=$?
          set -e
          test "$status" -eq 2
      - name: Smoke immutable Pilot completion
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.unit.test_pilot_review_optional_current_stage tests.unit.test_pilot_material_terminal_gate tests.unit.test_pilot_trust -v
