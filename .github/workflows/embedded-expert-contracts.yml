name: Embedded Expert Contracts

on:
  pull_request:
    paths:
      - 'README.md'
      - '研发中心AI数字员工研发流程规划.md'
      - 'docs/**'
      - 'domains/**'
      - '嵌入式系统专家团-核心参考/**'
      - 'expert-groups/embedded-system/**'
      - 'config/integrations/**'
      - 'contracts/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/branch-gc-allowlist.txt'
      - '.github/ISSUE_TEMPLATE/embedded-pilot.yml'
      - '.github/repository-governance-contract.json'
      - '.github/workflows/branch-gc.yml'
      - '.github/workflows/embedded-expert-contracts.yml'
      - '.github/workflows/repository-governance.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '研发中心AI数字员工研发流程规划.md'
      - 'docs/**'
      - 'domains/**'
      - '嵌入式系统专家团-核心参考/**'
      - 'expert-groups/embedded-system/**'
      - 'config/integrations/**'
      - 'contracts/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/branch-gc-allowlist.txt'
      - '.github/ISSUE_TEMPLATE/embedded-pilot.yml'
      - '.github/repository-governance-contract.json'
      - '.github/workflows/branch-gc.yml'
      - '.github/workflows/embedded-expert-contracts.yml'
      - '.github/workflows/repository-governance.yml'

permissions:
  contents: read

concurrency:
  group: embedded-expert-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact validator dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3' 'jsonschema==4.26.0'
      - name: Validate repository layout
        run: python scripts/validate_repo_layout.py
      - name: Validate provider-neutral architecture
        run: python scripts/validate_provider_neutral_architecture.py
      - name: Validate Edge Foundation target architecture
        run: python scripts/validate_edge_foundation_architecture.py
      - name: Evaluate Edge Foundation shadow routing
        run: python scripts/evaluate_edge_foundation_shadow.py --output /tmp/edge-foundation-shadow.json
      - name: Upload Edge Foundation shadow evaluation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edge-foundation-shadow-evaluation
          path: /tmp/edge-foundation-shadow.json
          if-no-files-found: error
          retention-days: 14
      - name: Evaluate synthetic Pilot shadow receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_edge_foundation_pilot_shadow.py \
            tests/fixtures/pilot-run.valid.json \
            --pilot-result tests/fixtures/pilot-result.valid.json \
            --output /tmp/edge-foundation-pilot-shadow.json
          python - /tmp/edge-foundation-pilot-shadow.json <<'PY'
          import json, sys
          receipt = json.load(open(sys.argv[1], encoding='utf-8'))
          assert receipt['routing_authority'] == 'legacy', receipt
          assert receipt['canonical_routing_changed'] is False, receipt
          assert receipt['pilot_track'] == 'debug', receipt
          assert receipt['eligibility_checks']['source_real'] is False, receipt
          assert receipt['eligibility_checks']['result_provided'] is True, receipt
          assert receipt['phase3_evidence_eligible'] is False, receipt
          assert 'synthetic-source-not-eligible' in receipt['eligibility_reasons'], receipt
          PY
      - name: Upload Edge Foundation Pilot shadow receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edge-foundation-pilot-shadow-receipt
          path: /tmp/edge-foundation-pilot-shadow.json
          if-no-files-found: error
          retention-days: 14
      - name: Prove phase-3 readiness stays blocked without real Pilot evidence
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/synthetic-run"
          cp /tmp/edge-foundation-pilot-shadow.json "$root/synthetic-run/edge-foundation-shadow-receipt.json"
          set +e
          python scripts/evaluate_edge_foundation_phase3_readiness.py \
            --receipt-dir "$root" \
            --output /tmp/edge-foundation-phase3-readiness.json \
            --require-ready
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected phase-3 readiness without real Pilot evidence to exit 2, got $status"
            exit 1
          fi
          python - /tmp/edge-foundation-phase3-readiness.json <<'PY'
          import json, sys
          readiness = json.load(open(sys.argv[1], encoding='utf-8'))
          assert readiness['status'] == 'BLOCKED', readiness
          assert readiness['eligible_for_phase3_review'] is False, readiness
          assert readiness['canonical_routing_switched'] is False, readiness
          assert readiness['receipts_scanned'] == 1, readiness
          assert readiness['eligible_real_receipts'] == 0, readiness
          assert readiness['blockers'], readiness
          PY
      - name: Upload Edge Foundation phase-3 readiness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edge-foundation-phase3-readiness
          path: /tmp/edge-foundation-phase3-readiness.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate core-reference synchronization
        run: python scripts/validate_core_reference.py
      - name: Validate Branch GC safety contract
        run: python scripts/validate_branch_gc.py
      - name: Validate Contract Catalog
        run: python scripts/validate_contract_catalog.py
      - name: Validate Embedded Domain Closed Loop V1
        run: python scripts/validate_embedded_closed_loop.py
      - name: Validate cross-repo AI operating system contract
        run: python scripts/validate_cross_repo_integration.py
      - name: Verify exact cross-repo checkouts and contract digests
        run: python scripts/verify_cross_repo_checkouts.py --root "$RUNNER_TEMP/dw-integrations" --fetch --output /tmp/cross-repo-verification.json
      - name: Upload cross-repo verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-repo-verification
          path: /tmp/cross-repo-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate expert-team contracts
        run: python scripts/validate_embedded_assets.py
      - name: Validate pilot operational contracts
        run: python scripts/validate_pilot_operations.py
      - name: Run trust regression tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Report live repository governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_repository_governance.py --report-only
      - name: Verify Knowledge Registry and adapter fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          python scripts/embedded_knowledge.py verify
          python scripts/embedded_knowledge.py query --text "debug evidence" --limit 5 --format json > /tmp/embedded-knowledge-query.json
          test -s /tmp/embedded-knowledge-query.json
          set +e
          python scripts/embedded_knowledge.py adapter-status > /tmp/embedded-knowledge-adapter-status.json
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected adapter-status without Knowledge Hub checkout to fail closed with exit=2, got $status"
            exit 1
          fi
          grep -q 'BLOCKED' /tmp/embedded-knowledge-adapter-status.json
      - name: Smoke closed-loop scaffold helper
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          python scripts/embedded_pilot.py init \
            --run-id CI-SCAFFOLD-001 \
            --track feature \
            --source-type synthetic \
            --task-type feature_development \
            --workflow-mode short_chain \
            --human-owner ci \
            --task-brief tests/fixtures/task-brief.valid.json \
            --repo-root firmware/main \
            --base-commit 0123456789abcdef0123456789abcdef01234567 \
            --output-root "$root"
          python scripts/embedded_pilot_scaffold.py "$root/CI-SCAFFOLD-001"
          test -f "$root/CI-SCAFFOLD-001/working/material-manifest.json"
          test -f "$root/CI-SCAFFOLD-001/working/acceptance-evidence-matrix.md"
          test -f "$root/CI-SCAFFOLD-001/working/knowledge-harvest.md"
          python - "$root/CI-SCAFFOLD-001/working/material-manifest.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding='utf-8'))
          assert doc['readiness'] == 'BLOCKED', doc
          assert 'test_environment' in doc['missing_critical'], doc
          PY
      - name: Reject short SHA for real Pilot
        shell: bash
        run: |
          set +e
          python scripts/embedded_pilot.py init \
            --run-id CI-SHORT-SHA \
            --track feature --source-type real \
            --task-type feature_development --workflow-mode short_chain \
            --human-owner ci --task-brief tests/fixtures/task-brief.valid.json \
            --repo-root firmware/main --base-commit 0123456 \
            --output-root "$(mktemp -d)"
          status=$?
          set -e
          test "$status" -ne 0
      - name: Evaluate synthetic pilot fixture
        run: python scripts/evaluate_embedded_pilot.py tests/fixtures/pilot-result.valid.json --output /tmp/pilot-metrics.json --markdown-output /tmp/pilot-metrics.md
      - name: Prove incorrect PASS is fail-closed
        shell: bash
        run: |
          set +e
          python scripts/evaluate_embedded_pilot.py tests/fixtures/pilot-result.incorrect-pass.json --fail-on-safety
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected evaluator safety exit=2, got $status"
            exit 1
          fi
      - name: Smoke immutable pilot completion
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          python scripts/embedded_pilot.py init \
            --run-id CI-PILOT-001 \
            --track feature \
            --source-type synthetic \
            --task-type feature_development \
            --workflow-mode short_chain \
            --human-owner ci \
            --task-brief tests/fixtures/task-brief.valid.json \
            --repo-root firmware/main \
            --base-commit 0123456789abcdef0123456789abcdef01234567 \
            --output-root "$root"
          python scripts/embedded_pilot.py status "$root/CI-PILOT-001" running --note "CI operational smoke"
          python scripts/embedded_pilot.py complete "$root/CI-PILOT-001" \
            --engineering-task-package tests/fixtures/engineering-task-package.valid.json \
            --delivery-receipt tests/fixtures/delivery-receipt.valid.json \
            --verification-report tests/fixtures/verification-report.valid.json \
            --review-report tests/fixtures/review-report.valid.json \
            --pilot-result tests/fixtures/pilot-result.feature.valid.json \
            --extra material_manifest=tests/fixtures/material-manifest.valid.json \
            --extra acceptance_evidence_matrix=tests/fixtures/acceptance-evidence-matrix.valid.md \
            --extra knowledge_harvest=tests/fixtures/knowledge-harvest.valid.md
          python scripts/embedded_pilot.py validate "$root/CI-PILOT-001"
          set +e
          python scripts/embedded_pilot.py bundle "$root/CI-PILOT-001" --fail-incomplete
          rebundle_status=$?
          python scripts/embedded_pilot.py status "$root/CI-PILOT-001" running
          reopen_status=$?
          set -e
          test "$rebundle_status" -ne 0
          test "$reopen_status" -ne 0
          python scripts/embedded_pilot.py summary "$root" --output /tmp/pilot-status.json
          python scripts/evaluate_embedded_pilot.py "$root/CI-PILOT-001/pilot-result.json" --output /tmp/pilot-ops-metrics.json
