name: Runtime R2 Independent Review

on:
  workflow_dispatch:
    inputs:
      verification_report_path:
        description: "Tracked local R2 verification receipt under reports/runtime-r2/verification/"
        required: true
        default: "reports/runtime-r2/verification/R2-FEATURE-PCR02-OTA-001/runtime-r2-domain-verification.json"
        type: string
      decision:
        description: "Type APPROVE_R2_REVIEW to submit an independent review approval"
        required: true
        default: "DENY"
        type: string
      review_notes:
        description: "Human review rationale; must be non-empty and specific to this evidence set"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-r2-independent-review-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Digital Worker review authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enforce explicit main-only human review request
        env:
          DECISION: ${{ inputs.decision }}
          REVIEW_NOTES: ${{ inputs.review_notes }}
          VERIFICATION_REPORT_PATH: ${{ inputs.verification_report_path }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$DECISION" = APPROVE_R2_REVIEW
          test -n "${REVIEW_NOTES//[[:space:]]/}"
          case "$GITHUB_ACTOR" in
            *"[bot]"|github-actions) echo '::error::BLOCKED_INDEPENDENT_REVIEW_REQUIRES_HUMAN_ACTOR'; exit 2 ;;
          esac
          case "$VERIFICATION_REPORT_PATH" in
            reports/runtime-r2/verification/*) ;;
            *) echo '::error::verification_report_path must stay under reports/runtime-r2/verification'; exit 2 ;;
          esac
          test -f "$VERIFICATION_REPORT_PATH"

      - name: Validate tracked local verification receipt and reviewer independence
        env:
          REVIEWER: ${{ github.actor }}
          VERIFICATION_REPORT_PATH: ${{ inputs.verification_report_path }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$VERIFICATION_REPORT_PATH" <<'PY'
          import json,os,re,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          assert value['schema']=='digital-worker-runtime-r2-domain-verification/v1',value
          assert value['status']=='pass',value
          assert value['comparison_id']=='R2-FEATURE-PCR02-OTA-001',value
          assert value['source_repository']=='jiying2007/digital-worker',value
          assert re.fullmatch(r'[0-9a-f]{40}',value['source_commit']),value
          assert re.fullmatch(r'[0-9a-f]{40}',value['verification_tool_commit']),value
          assert value['verification_execution_venue']=='local-terminal',value
          assert value['runtime_home_mode']=='shared-user-home',value
          assert value['credential_state_in_evidence'] is False,value
          assert value['github_provider_credentials_required'] is False,value
          assert value['independent_review_status']=='pending',value
          assert value['verification_pass_claimed_by_runtime'] is False,value
          receipts=value['execution_receipts']; assert set(receipts)=={'codex','claude-code'},receipts
          assert all(re.fullmatch(r'[0-9a-f]{64}',x) for x in receipts.values()),receipts
          actors=value['provider_execution_actors']; assert set(actors)=={'codex','claude-code'},actors
          assert all(isinstance(x,str) and x for x in actors.values()),actors
          evidence=value['provider_execution_evidence']; assert set(evidence)=={'codex','claude-code'},evidence
          assert all(x.get('execution_venue')=='local-terminal' for x in evidence.values()),evidence
          assert all(x.get('runtime_home_mode')=='shared-user-home' for x in evidence.values()),evidence
          assert all(x.get('credential_state_in_evidence') is False for x in evidence.values()),evidence
          assert all(re.fullmatch(r'[0-9a-f]{64}',x.get('replay_postflight_sha256','')) for x in evidence.values()),evidence
          verifier=value['verification_actor']; assert isinstance(verifier,str) and verifier,verifier
          reviewer=os.environ['REVIEWER']
          assert reviewer!=verifier,(reviewer,verifier)
          assert reviewer not in set(actors.values()),(reviewer,actors)
          PY

      - name: Build bounded independent review report
        env:
          REVIEW_NOTES: ${{ inputs.review_notes }}
          REVIEWER: ${{ github.actor }}
          VERIFICATION_REPORT_PATH: ${{ inputs.verification_report_path }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$VERIFICATION_REPORT_PATH" "$RUNNER_TEMP/runtime-r2-independent-review.json" <<'PY'
          import hashlib,json,os,pathlib,sys
          verification_path,out=map(pathlib.Path,sys.argv[1:])
          verification=json.loads(verification_path.read_text(encoding='utf-8'))
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          reviewer=os.environ['REVIEWER']
          verifier=verification['verification_actor']
          actors=verification['provider_execution_actors']
          assert reviewer!=verifier and reviewer not in set(actors.values())
          report={
              'schema':'digital-worker-runtime-r2-independent-review/v1',
              'status':'pass',
              'comparison_id':verification['comparison_id'],
              'frozen_inputs_sha256':verification['frozen_inputs_sha256'],
              'standard_id':verification['standard_id'],
              'source_repository':verification['source_repository'],
              'source_commit':verification['source_commit'],
              'verification_tool_commit':verification['verification_tool_commit'],
              'runtime_home_mode':'shared-user-home',
              'credential_state_in_evidence':False,
              'execution_receipts':verification['execution_receipts'],
              'provider_execution_evidence':verification['provider_execution_evidence'],
              'independent':True,
              'reviewer_identity':'github-user:'+reviewer,
              'reviewer_independence':{
                  'provider_execution_actors':actors,
                  'verification_actor':verifier,
                  'review_actor_distinct_from_all_provider_executors':True,
                  'review_actor_distinct_from_verifier':True,
              },
              'review_decision':'approve-evidence-for-r2-certifier-input',
              'review_notes':os.environ['REVIEW_NOTES'],
              'verification_report_ref':os.environ['VERIFICATION_REPORT_PATH'],
              'verification_report_sha256':sha(verification_path),
              'verification_pass_claimed_by_runtime':False,
              'release_ready_claimed':False,
              'r2_qualified':False,
              'next_gate':'root-runtime-portability-certifier',
          }
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Upload independent review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-r2-independent-review-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-r2-independent-review.json
          if-no-files-found: error
          retention-days: 90
