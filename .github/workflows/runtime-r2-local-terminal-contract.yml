name: Runtime R2 Local Terminal Contract

on:
  pull_request:
    paths:
      - '.github/workflows/runtime-r2-freeze.yml'
      - '.github/workflows/runtime-r2-local-terminal-contract.yml'
      - 'config/integrations/cross-repo-lock.json'
      - 'docs/runbooks/runtime-r2-local-terminal.md'
      - 'manifests/runtime-r2-qualification-policy.json'
      - 'scripts/runtime_r2_evidence.py'
      - 'tests/unit/test_runtime_r2_freeze_ledger.py'
      - 'tests/unit/test_runtime_r2_local_terminal_contract.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-r2-freeze.yml'
      - '.github/workflows/runtime-r2-local-terminal-contract.yml'
      - 'config/integrations/cross-repo-lock.json'
      - 'docs/runbooks/runtime-r2-local-terminal.md'
      - 'manifests/runtime-r2-qualification-policy.json'
      - 'scripts/runtime_r2_evidence.py'
      - 'tests/unit/test_runtime_r2_freeze_ledger.py'
      - 'tests/unit/test_runtime_r2_local_terminal_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
      - name: Validate R2 local-terminal contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.unit.test_runtime_r2_local_terminal_contract \
            tests.unit.test_runtime_r2_freeze_ledger
          python - <<'PY'
          import json, pathlib, re, yaml

          freeze=pathlib.Path('.github/workflows/runtime-r2-freeze.yml')
          yaml.load(freeze.read_text(encoding='utf-8'), Loader=yaml.BaseLoader)

          lock=json.loads(pathlib.Path('config/integrations/cross-repo-lock.json').read_text(encoding='utf-8'))
          bindings=lock['runtime_bindings']
          assert set(bindings) == {'codex','claude-code'}
          assert bindings['codex']['repository'] == 'jiying2007/codex'
          assert bindings['claude-code']['repository'] == 'jiying2007/claude'
          assert re.fullmatch(r'[0-9a-f]{40}', bindings['codex']['commit'])
          assert re.fullmatch(r'[0-9a-f]{40}', bindings['claude-code']['commit'])
          assert 'REPLAY_POSTFLIGHT_GATED' in bindings['codex']['validation']
          assert 'REPLAY_POSTFLIGHT_GATED' in bindings['claude-code']['validation']
          assert 'WORKSPACE_SCAFFOLDING_ALLOWED' in bindings['claude-code']['validation']
          assert 'BOUNDED_CONFIGURABLE_TURN_BUDGET' in bindings['claude-code']['validation']

          retired={
              '79acb193cef381b4c8b72f00e0af15f87e32765c',
              'fba4551aa4a2abe5f74cff3c60e8318961b36add',
              '364277dc52fc0b18c4fc30168c8bb82878ad2204',
              '81c8890ef952104c629c99e11259da6f180ce7db',
              'e80116bf2c192b02b5b038120323ef4af4618fa6',
              '50e9b8d4d19d35d3315ba8400e87dfe851a749dd',
              'c4a1fa995b281da909be10bfe5c41fe719ce2759',
              'e6d2be534a85ac1208967774612f07b54c59a0b5',
              'e358b029607cf9dc5429eb7c2ca05b5d4a13c0f1',
              '1d77de27ef01d9be403ce0bd8ce50e2ece5d8967',
              'cc3044eefd42d2f95f68d2ae85024845e9edcf63',
              '6ef0c97503d2e81dae0ddbe8a477449c4961b690',
          }
          assert bindings['codex']['commit'] not in retired
          assert bindings['claude-code']['commit'] not in retired

          runbook=pathlib.Path('docs/runbooks/runtime-r2-local-terminal.md').read_text(encoding='utf-8')
          freeze_text=freeze.read_text(encoding='utf-8')
          policy=json.loads(pathlib.Path('manifests/runtime-r2-qualification-policy.json').read_text(encoding='utf-8'))
          assert 'runtime-r2-provider-execution.yml' not in freeze_text
          assert "'runtime_home_mode':'shared-user-home'" in freeze_text
          assert "'credential_state_in_evidence':False" in freeze_text
          assert "'qualification_mode':'periodic-non-blocking'" in freeze_text
          assert "'repository_closure_blocking':False" in freeze_text
          assert "'product_release_blocking':False" in freeze_text
          intake_text=pathlib.Path('scripts/runtime_r2_intake.py').read_text(encoding='utf-8')
          assert 'execution_context_mode' in intake_text
          assert 'frozen-project-local' in intake_text
          assert 'user_setting_source_loaded' in intake_text
          assert 'Python 3.11' in runbook
          assert 'replay postflight' in runbook
          assert 'same frozen task' in runbook
          assert 'quarterly' in runbook
          assert 'blocked' in runbook
          assert 'repository closure' in runbook
          assert policy['scope']['repository_closure_blocking'] is False
          assert policy['scope']['product_release_blocking'] is False
          assert policy['scope']['runtime_binding_r1_required'] is True
          assert policy['scope']['runtime_portability_claim_requires_r2'] is True
          assert policy['campaign']['independent_human_review_required'] is False
          assert policy['campaign']['root_certifier_required'] is False
          assert 'openai-api-key' not in runbook
          assert 'anthropic_api_key' not in runbook
          print('[PASS] Digital Worker keeps R2 provider-free, periodic, replay-gated, and non-blocking for repository/product closure')
          PY
