name: Runtime R2 Local Terminal Contract

on:
  pull_request:
    paths:
      - '.github/workflows/runtime-r2-freeze.yml'
      - '.github/workflows/runtime-r2-local-terminal-contract.yml'
      - 'config/integrations/cross-repo-lock.json'
      - 'docs/runbooks/runtime-r2-local-terminal.md'
      - 'scripts/runtime_r2_evidence.py'
      - 'tests/unit/test_runtime_r2_freeze_ledger.py'
      - 'tests/unit/test_runtime_r2_local_terminal_contract.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-r2-freeze.yml'
      - '.github/workflows/runtime-r2-local-terminal-contract.yml'
      - 'config/integrations/cross-repo-lock.json'
      - 'docs/runbooks/runtime-r2-local-terminal.md'
      - 'scripts/runtime_r2_evidence.py'
      - 'tests/unit/test_runtime_r2_freeze_ledger.py'
      - 'tests/unit/test_runtime_r2_local_terminal_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
      - name: Validate R2 local-terminal contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.unit.test_runtime_r2_local_terminal_contract \
            tests.unit.test_runtime_r2_freeze_ledger
          python - <<'PY'
          import json, pathlib, re, yaml

          freeze=pathlib.Path('.github/workflows/runtime-r2-freeze.yml')
          yaml.load(freeze.read_text(encoding='utf-8'), Loader=yaml.BaseLoader)

          lock=json.loads(pathlib.Path('config/integrations/cross-repo-lock.json').read_text(encoding='utf-8'))
          bindings=lock['runtime_bindings']
          assert set(bindings) == {'codex','claude-code'}
          assert bindings['codex']['repository'] == 'jiying2007/codex'
          assert bindings['claude-code']['repository'] == 'jiying2007/claude'
          assert re.fullmatch(r'[0-9a-f]{40}', bindings['codex']['commit'])
          assert re.fullmatch(r'[0-9a-f]{40}', bindings['claude-code']['commit'])

          retired={
              '79acb193cef381b4c8b72f00e0af15f87e32765c',
              'fba4551aa4a2abe5f74cff3c60e8318961b36add',
          }
          assert bindings['codex']['commit'] not in retired
          assert bindings['claude-code']['commit'] not in retired

          text='\n'.join([
              freeze.read_text(encoding='utf-8'),
              pathlib.Path('docs/runbooks/runtime-r2-local-terminal.md').read_text(encoding='utf-8'),
          ])
          assert 'runtime-r2-provider-execution.yml' not in freeze.read_text(encoding='utf-8')
          assert 'openai-api-key' not in text
          assert 'anthropic_api_key' not in text
          print('[PASS] Digital Worker freezes exact runtime identities without GitHub provider credentials')
          PY
