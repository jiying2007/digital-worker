name: Repository Governance Audit

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Require productionization server-side governance now'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: repository-governance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Audit live GitHub server governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.strict }}" == "true" ]]; then
            python scripts/verify_repository_governance.py --strict
          else
            python scripts/verify_repository_governance.py
          fi
