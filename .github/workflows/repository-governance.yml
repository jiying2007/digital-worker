name: Repository Governance Audit

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Require productionization server-side governance now'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: repository-governance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Audit live GitHub server governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.strict }}" == "true" ]]; then
            python scripts/verify_repository_governance.py --strict
          else
            python scripts/verify_repository_governance.py
          fi
