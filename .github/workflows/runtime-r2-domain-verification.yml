name: Runtime R2 Domain Verification

on:
  workflow_dispatch:
    inputs:
      campaign_dir:
        description: "Tracked Digital Worker path containing campaign.json, frozen-plan.json, and both attested runtime evidence subjects"
        required: true
        default: "reports/runtime-r2/intake/R2-FEATURE-PCR02-OTA-001"
        type: string
      confirmation:
        description: "Type VERIFY_REAL_R2 to verify the attested runtime-owned outputs"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-r2-domain-verification-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Digital Worker verification authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enforce explicit main-only verification request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CAMPAIGN_DIR: ${{ inputs.campaign_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = VERIFY_REAL_R2
          case "$CAMPAIGN_DIR" in
            reports/runtime-r2/intake/*) ;;
            *) echo "::error::campaign_dir must stay under reports/runtime-r2/intake"; exit 2 ;;
          esac
          test -f "$CAMPAIGN_DIR/campaign.json"
          test -f "$CAMPAIGN_DIR/frozen-plan.json"

      - name: Verify GitHub OIDC provenance and project native receipts
        env:
          CAMPAIGN_DIR: ${{ inputs.campaign_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/runtime_r2_intake.py \
            --root . \
            --campaign-dir "$CAMPAIGN_DIR" \
            --out "$RUNNER_TEMP/r2-intake" \
            --summary-json > "$RUNNER_TEMP/r2-intake-summary.json"
          python - "$RUNNER_TEMP/r2-intake-summary.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          assert value['status']=='provider-executions-collected-pending-digital-worker-verification-review',value
          assert value['verification_pass_claimed'] is False,value
          assert value['r2_qualified'] is False,value
          assert set(value['execution_receipts'])=={'codex','claude-code'},value
          PY

      - name: Bind replay-complete result trees to native receipts
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/r2-intake/codex/evidence/codex-native.json" "$RUNNER_TEMP/r2-intake/codex/result-tree" "$RUNNER_TEMP/r2-intake/claude-code/evidence/claude-native-validated.json" "$RUNNER_TEMP/r2-intake/claude-code/result-tree" <<'PY'
          import hashlib,json,pathlib,sys
          cn_path,cr,an_path,ar=map(pathlib.Path,sys.argv[1:])
          cn=json.loads(cn_path.read_text()); an=json.loads(an_path.read_text())
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def tree_digest(root):
              assert not (root/'.git').exists(),root
              rows=[]
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rows.append((p.relative_to(root).as_posix(),sha(p)))
              return hashlib.sha256(json.dumps(rows,separators=(',',':')).encode()).hexdigest()
          def expected(receipt):
              matches=[x.split('worktree-result:sha256:',1)[1] for x in receipt.get('evidence_refs',[]) if x.startswith('worktree-result:sha256:')]
              assert len(matches)==1,matches
              return matches[0]
          assert tree_digest(cr)==expected(cn),(tree_digest(cr),expected(cn))
          assert tree_digest(ar)==expected(an),(tree_digest(ar),expected(an))
          PY

      - name: Independently host-verify Codex result tree
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/r2-intake/codex/result-tree"
          (cd "$root" && python -m unittest discover -s tests -v) 2>&1 | tee "$RUNNER_TEMP/codex-domain-host-tests.log"
          (cd "$root" && python verify_ota_manifest.py --manifest ota-manifest.v1.json) 2>&1 | tee "$RUNNER_TEMP/codex-domain-ota-verify.log"

      - name: Independently host-verify Claude result tree
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/r2-intake/claude-code/result-tree"
          (cd "$root" && python -m unittest discover -s tests -v) 2>&1 | tee "$RUNNER_TEMP/claude-domain-host-tests.log"
          (cd "$root" && python verify_ota_manifest.py --manifest ota-manifest.v1.json) 2>&1 | tee "$RUNNER_TEMP/claude-domain-ota-verify.log"

      - name: Issue Digital Worker Domain Verification evidence
        env:
          CAMPAIGN_DIR: ${{ inputs.campaign_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/r2-intake/intake-collection.json" "$RUNNER_TEMP/runtime-r2-domain-verification.json" <<'PY'
          import hashlib,json,os,pathlib,sys
          collection_path,out=map(pathlib.Path,sys.argv[1:]); collection=json.loads(collection_path.read_text())
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          report={
              'schema':'digital-worker-runtime-r2-domain-verification/v1',
              'status':'pass',
              'comparison_id':collection['campaign_id'],
              'frozen_inputs_sha256':collection['frozen_inputs_sha256'],
              'standard_id':'digital-worker-runtime-r2-host-verification/v1',
              'source_repository':'jiying2007/digital-worker',
              'source_commit':os.environ['GITHUB_SHA'],
              'campaign_dir':os.environ['CAMPAIGN_DIR'],
              'provider_workflow_runs':collection['provider_workflow_runs'],
              'provider_execution_actors':collection['provider_execution_actors'],
              'execution_receipts':collection['execution_receipts'],
              'verification_scope':['github-oidc-attestation','exact-frozen-task','native-to-portable-receipt','replay-complete-result-tree','provider-result-identity','host-unit-tests','ota-manifest-verifier'],
              'verification_actor':'github-user:'+os.environ['GITHUB_ACTOR'],
              'verification_pass_claimed_by_runtime':False,
              'independent_review_status':'pending',
              'intake_collection_sha256':sha(collection_path),
              'test_evidence':{
                  'codex_host_tests_sha256':sha(pathlib.Path(os.environ['RUNNER_TEMP'])/'codex-domain-host-tests.log'),
                  'codex_ota_verify_sha256':sha(pathlib.Path(os.environ['RUNNER_TEMP'])/'codex-domain-ota-verify.log'),
                  'claude_host_tests_sha256':sha(pathlib.Path(os.environ['RUNNER_TEMP'])/'claude-domain-host-tests.log'),
                  'claude_ota_verify_sha256':sha(pathlib.Path(os.environ['RUNNER_TEMP'])/'claude-domain-ota-verify.log'),
              },
          }
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload Digital Worker domain verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-r2-domain-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/runtime-r2-domain-verification.json
            ${{ runner.temp }}/r2-intake/intake-collection.json
            ${{ runner.temp }}/r2-intake/codex/portable-receipt.json
            ${{ runner.temp }}/r2-intake/claude-code/portable-receipt.json
            ${{ runner.temp }}/codex-domain-host-tests.log
            ${{ runner.temp }}/codex-domain-ota-verify.log
            ${{ runner.temp }}/claude-domain-host-tests.log
            ${{ runner.temp }}/claude-domain-ota-verify.log
          if-no-files-found: error
          retention-days: 90
