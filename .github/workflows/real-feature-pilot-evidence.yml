name: Real Feature Pilot Evidence

on:
  pull_request:
    paths:
      - 'expert-groups/embedded-system/pilot/evidence/FEATURE-PCR02-OTA-001/**'
      - 'expert-groups/embedded-system/pilot/artifact-requirements.yaml'
      - 'expert-groups/embedded-system/pilot/pilot-plan.yaml'
      - 'scripts/embedded_pilot.py'
      - 'scripts/evaluate_edge_foundation_pilot_shadow.py'
      - 'scripts/evaluate_edge_foundation_phase3_readiness.py'
      - '.github/workflows/real-feature-pilot-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'expert-groups/embedded-system/pilot/evidence/FEATURE-PCR02-OTA-001/**'
      - 'expert-groups/embedded-system/pilot/artifact-requirements.yaml'
      - 'expert-groups/embedded-system/pilot/pilot-plan.yaml'
      - 'scripts/embedded_pilot.py'
      - 'scripts/evaluate_edge_foundation_pilot_shadow.py'
      - 'scripts/evaluate_edge_foundation_phase3_readiness.py'
      - '.github/workflows/real-feature-pilot-evidence.yml'

permissions:
  contents: read

jobs:
  validate-real-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact validator dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3' 'jsonschema==4.26.0'
      - name: Materialize and freeze real Feature Pilot
        shell: bash
        run: |
          set -euo pipefail
          source_dir="expert-groups/embedded-system/pilot/evidence/FEATURE-PCR02-OTA-001"
          runs_root="$RUNNER_TEMP/real-pilot-runs"
          run_dir="$runs_root/FEATURE-PCR02-OTA-001"

          python scripts/embedded_pilot.py init \
            --run-id FEATURE-PCR02-OTA-001 \
            --track feature \
            --source-type real \
            --task-type component_development \
            --workflow-mode short_chain \
            --human-owner embedded-system \
            --task-brief "$source_dir/task-brief.json" \
            --repo-root jiying2007/ota_download_test \
            --base-commit eeb926bd1fff75d2a5d5abb9f0ede9c8f582cc6d \
            --output-root "$runs_root"

          python scripts/embedded_pilot.py complete "$run_dir" \
            --engineering-task-package "$source_dir/engineering-task-package.json" \
            --delivery-receipt "$source_dir/delivery-receipt.json" \
            --verification-report "$source_dir/verification-report.json" \
            --pilot-result "$source_dir/pilot-result.json" \
            --extra material_manifest="$source_dir/extras/material_manifest.json" \
            --extra acceptance_evidence_matrix="$source_dir/extras/acceptance_evidence_matrix.md" \
            --extra knowledge_harvest="$source_dir/extras/knowledge_harvest.md"

          python scripts/embedded_pilot.py validate "$run_dir"
          python scripts/embedded_pilot.py edge-shadow "$run_dir"

          python - "$run_dir" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          run = json.loads((root / 'pilot-run.json').read_text(encoding='utf-8'))
          receipt = json.loads((root / 'edge-foundation-shadow-receipt.json').read_text(encoding='utf-8'))
          assert run['status'] == 'completed', run
          assert run['source_type'] == 'real', run
          assert run['review_report_ref'] is None, run
          assert run['verification_report_ref'], run
          assert run['evidence_bundle_ref'], run
          assert receipt['phase3_evidence_eligible'] is True, receipt
          assert receipt['pilot_track'] == 'feature', receipt
          assert receipt['pilot_outcome'] == 'PASS', receipt
          PY

          set +e
          python scripts/embedded_pilot.py phase3-readiness "$runs_root" \
            --output "$RUNNER_TEMP/phase3-readiness.json" \
            --require-ready
          status=$?
          set -e
          test "$status" -eq 2
          python - "$RUNNER_TEMP/phase3-readiness.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding='utf-8'))
          assert result['status'] == 'BLOCKED', result
          assert result['eligible_real_receipts'] == 1, result
          assert result['track_counts']['feature'] >= 1, result
          PY
      - name: Upload real Feature Pilot frozen evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-feature-pilot-feature-pcr02-ota-001
          path: |
            ${{ runner.temp }}/real-pilot-runs/FEATURE-PCR02-OTA-001
            ${{ runner.temp }}/phase3-readiness.json
          if-no-files-found: error
          retention-days: 90
