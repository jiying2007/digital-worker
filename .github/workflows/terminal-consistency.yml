name: Terminal Consistency

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terminal-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install exact validator dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Validate terminal Edge Foundation consistency
        run: python scripts/validate_terminal_consistency.py
      - name: Validate zero live legacy references
        run: python scripts/validate_zero_live_legacy_refs.py
