name: Terminal Consistency

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'domains/edge-foundation/**'
      - '嵌入式系统专家团-核心参考/**'
      - 'scripts/**'
      - '.github/workflows/terminal-consistency.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'domains/edge-foundation/**'
      - '嵌入式系统专家团-核心参考/**'
      - 'scripts/**'
      - '.github/workflows/terminal-consistency.yml'

permissions:
  contents: read

concurrency:
  group: terminal-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact validator dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Validate terminal Edge Foundation consistency
        run: python scripts/validate_terminal_consistency.py
      - name: Validate zero live legacy references
        run: python scripts/validate_zero_live_legacy_refs.py
