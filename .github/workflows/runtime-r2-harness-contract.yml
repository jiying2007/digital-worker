name: Runtime R2 Harness Contract

on:
  pull_request:
    paths:
      - '.github/workflows/runtime-r2-freeze.yml'
      - '.github/workflows/runtime-r2-domain-verification.yml'
      - '.github/workflows/runtime-r2-independent-review.yml'
      - '.github/workflows/runtime-r2-harness-contract.yml'
      - 'scripts/runtime_r2_evidence.py'
      - 'scripts/runtime_r2_intake.py'
      - 'config/integrations/provider-capability-matrix.yaml'
      - 'config/integrations/runtime-execution-profiles.json'
      - 'scripts/runtime_execution_adapter.py'
      - 'tests/unit/test_runtime_execution_adapter.py'
      - 'tests/unit/test_runtime_execution_capability_projection.py'
      - 'tests/unit/test_runtime_r2_execution_boundary.py'
      - 'tests/unit/test_runtime_r2_domain_verification_workflow.py'
      - 'tests/unit/test_runtime_r2_independent_review_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-r2-freeze.yml'
      - '.github/workflows/runtime-r2-domain-verification.yml'
      - '.github/workflows/runtime-r2-independent-review.yml'
      - '.github/workflows/runtime-r2-harness-contract.yml'
      - 'scripts/runtime_r2_evidence.py'
      - 'scripts/runtime_r2_intake.py'
      - 'config/integrations/provider-capability-matrix.yaml'
      - 'config/integrations/runtime-execution-profiles.json'
      - 'scripts/runtime_execution_adapter.py'
      - 'tests/unit/test_runtime_execution_adapter.py'
      - 'tests/unit/test_runtime_execution_capability_projection.py'
      - 'tests/unit/test_runtime_r2_execution_boundary.py'
      - 'tests/unit/test_runtime_r2_domain_verification_workflow.py'
      - 'tests/unit/test_runtime_r2_independent_review_workflow.py'

permissions:
  contents: read

concurrency:
  group: runtime-r2-harness-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact validation dependency
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
      - name: Validate provider-neutral execution profile and native CLI adapter
        run: python -m unittest tests.unit.test_runtime_execution_adapter -v
      - name: Validate execution profile capability projection
        run: python -m unittest tests.unit.test_runtime_execution_capability_projection -v
      - name: Ratchet provider-free Digital Worker R2 execution boundary
        run: python -m unittest tests.unit.test_runtime_r2_execution_boundary -v
      - name: Validate attested independent R2 domain verification contract
        run: python -m unittest tests.unit.test_runtime_r2_domain_verification_workflow -v
      - name: Validate fail-closed independent R2 review contract
        run: python -m unittest tests.unit.test_runtime_r2_independent_review_workflow -v
