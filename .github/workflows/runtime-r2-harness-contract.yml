name: Runtime R2 Harness Contract

on:
  pull_request:
    paths:
      - '.github/workflows/runtime-r2-freeze.yml'
      - '.github/workflows/runtime-r2-independent-review.yml'
      - '.github/workflows/runtime-r2-harness-contract.yml'
      - 'scripts/runtime_r2_evidence.py'
      - 'manifests/r2_frozen_adk_release.lock.json'
      - 'config/integrations/cross-repo-lock.json'
      - 'tests/unit/test_runtime_r2_evidence.py'
      - 'scripts/runtime_r2_intake.py'
      - 'scripts/runtime_r2_local_verify.py'
      - 'reports/runtime-r2/freeze/**'
      - 'config/integrations/provider-capability-matrix.yaml'
      - 'config/integrations/runtime-execution-profiles.json'
      - 'scripts/runtime_execution_adapter.py'
      - 'tests/unit/test_runtime_execution_adapter.py'
      - 'tests/unit/test_runtime_execution_capability_projection.py'
      - 'tests/unit/test_runtime_r2_execution_boundary.py'
      - 'tests/unit/test_runtime_r2_local_flow.py'
      - 'tests/unit/test_runtime_r2_freeze_ledger.py'
      - 'tests/unit/test_runtime_r2_independent_review_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-r2-freeze.yml'
      - '.github/workflows/runtime-r2-domain-verification.yml'
      - '.github/workflows/runtime-r2-independent-review.yml'
      - '.github/workflows/runtime-r2-harness-contract.yml'
      - 'scripts/runtime_r2_evidence.py'
      - 'manifests/r2_frozen_adk_release.lock.json'
      - 'config/integrations/cross-repo-lock.json'
      - 'tests/unit/test_runtime_r2_evidence.py'
      - 'scripts/runtime_r2_intake.py'
      - 'scripts/runtime_r2_assemble_intake.py'
      - 'reports/runtime-r2/freeze/**'
      - 'config/integrations/provider-capability-matrix.yaml'
      - 'config/integrations/runtime-execution-profiles.json'
      - 'scripts/runtime_execution_adapter.py'
      - 'tests/unit/test_runtime_execution_adapter.py'
      - 'tests/unit/test_runtime_execution_capability_projection.py'
      - 'tests/unit/test_runtime_r2_execution_boundary.py'
      - 'tests/unit/test_runtime_r2_freeze_ledger.py'
      - 'tests/unit/test_runtime_r2_assemble_intake.py'
      - 'tests/unit/test_runtime_r2_domain_verification_workflow.py'
      - 'tests/unit/test_runtime_r2_independent_review_workflow.py'

permissions:
  contents: read

concurrency:
  group: runtime-r2-harness-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact validation dependency
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
      - name: Compile R2 intake and parse workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/runtime_r2_evidence.py scripts/runtime_r2_intake.py scripts/runtime_r2_local_verify.py
          python - <<'PY'
          import pathlib, yaml
          for name in (
              'runtime-r2-freeze.yml',
              'runtime-r2-independent-review.yml',
              'runtime-r2-harness-contract.yml',
          ):
              path=pathlib.Path('.github/workflows')/name
              value=yaml.load(path.read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
              assert isinstance(value,dict),path
          PY
      - name: Validate provider-neutral execution profile and native CLI adapter
        run: python -m unittest tests.unit.test_runtime_execution_adapter -v
      - name: Validate execution profile capability projection
        run: python -m unittest tests.unit.test_runtime_execution_capability_projection -v
      - name: Validate frozen ADK 7.0.4 R2 identity and runtime bindings
        run: python -m unittest tests.unit.test_runtime_r2_evidence -v
      - name: Ratchet provider-free Digital Worker R2 execution boundary
        run: python -m unittest tests.unit.test_runtime_r2_execution_boundary -v
      - name: Validate retained real R2 freeze ledger boundary
        run: python -m unittest tests.unit.test_runtime_r2_freeze_ledger -v
      - name: Validate local R2 intake and domain verification flow
        run: python -m unittest tests.unit.test_runtime_r2_local_flow -v
      - name: Validate fail-closed independent R2 review contract
        run: python -m unittest tests.unit.test_runtime_r2_independent_review_workflow -v
