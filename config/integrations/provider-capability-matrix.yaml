        operational_readiness: SOURCE_SET_BOUND
        capabilities:
          runtime_profiles: native
          target_mapping: native
          exact_release_source_blobs: native
          runtime_distribution_assembly: native
          thin_session_bootstrap_l0_l1_l2: native
          source_build_plan_dry_run_apply: native
