    decision: codex-source-set-bound-default-not-frozen

  runtime_practice_eval:
    candidate: llm_agent
    repository: jiying2007/llm_agent
    evidence:
      contract: manifests/digital_worker_runtime_pilot.json
      contract_version: '1.2'
      pinned_commit: 270d38f8b65da32cd8c7c4d5c2cac427682a6d28
