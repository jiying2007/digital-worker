schema_version: 3
status: evidence-in-progress
provider_selection: not_frozen
architecture_model: four-control-planes-plus-replaceable-runtime-bindings

roles:
  knowledge_control_plane:
    candidate: knowledge-hub
    evidence:
      identity_ref: config/integrations/cross-repo-lock.json#/providers/knowledge_control_plane
      checkout_verification: permanent-digital-worker-ci
      first_real_reuse_work_item: KNOWLEDGE-E3-GOVERNANCE-001
      first_real_reuse_receipt: domains/edge-foundation/pilot/evidence/KNOWLEDGE-E3-GOVERNANCE-001/knowledge-reuse-receipt.json
    capabilities:
      registry: native
      context_preflight: native
      evidence_pack: native
      action_check: native
      proposal_lifecycle: native
      owner_review: native
      source_acl_provenance: native
      public_runtime_consumer_contract: pinned-contract-verified
      digital_worker_project_route: registered-governed-route
      digital_worker_real_reuse_evidence: first-real-reuse-eligible
    decision: candidate-not-default

  agent_asset_control_plane:
    candidate: agent-dev-kit
    evidence:
      identity_ref: config/integrations/cross-repo-lock.json#/providers/agent_asset_control_plane
      checkout_verification: permanent-digital-worker-ci
    capabilities:
      agent_asset_ssot: native
      skill_asset_ssot: native
      asset_profiles: native
      embedded_fullstack_profile: native
      immutable_release_identity: native
      exact_source_set_handoff: native
      provider_produced_monolithic_runtime_bundle: not-required-by-contract
      runtime_specific_live_write: forbidden-by-contract
    decision: preferred-candidate-for-pilot

  runtime_binding:
    candidates:
      codex:
        identity_ref: config/integrations/cross-repo-lock.json#/runtime_bindings/codex
        capabilities:
          runtime_profiles: native
          target_mapping: native
          exact_release_source_blobs: native
          runtime_distribution_assembly: native
          thin_session_bootstrap_l0_l1_l2: native
          source_build_plan_dry_run_apply: native
          rollback: native
          mcp_sandbox_binding: native
          live_drift: native
          execution_receipt_contract: source-set-v2-native
          domain_verification_pass: unsupported-by-design
      claude_code:
        identity_ref: config/integrations/cross-repo-lock.json#/runtime_bindings/claude
        capabilities:
          runtime_profiles: native
          target_mapping: native
          exact_release_source_blobs: native
          runtime_distribution_assembly: native
          thin_session_bootstrap_l0_l1_l2: native
          source_set_materialization: native
          fail_closed_identity_bootstrap: native
          execution_receipt_contract: source-set-v2-native
          real_provider_execution_receipt: pending-external-execution
          r2_real_provider_substitution: pending-external-evidence
          domain_verification_pass: unsupported-by-design
    decision: two-r1-source-set-bound-candidates-provider-selection-not-frozen

  assurance_binding:
    candidates:
      codex_review_safe:
        identity_ref: config/integrations/cross-repo-lock.json#/assurance_bindings/codex_review_safe
        supported_roles: [independent-review-evidence]
        capabilities:
          immutable_product_release_identity: native
          native_review_receipt_v5: native
          exact_provider_subject_fingerprint: native
          consumer_subject_mapping: required
          domain_verification_pass: unsupported-by-design
          independent_review_decision: unsupported-by-design
          product_qualification: unsupported-by-design
      human_or_other_provider:
        status: valid-provider-neutral-path
    decision: codex-review-safe-candidate-not-default-real-run-evidence-pending

  runtime_practice_eval:
    candidate: llm_agent
    evidence:
      identity_ref: config/integrations/cross-repo-lock.json#/providers/runtime_practice_eval
      checkout_verification: permanent-digital-worker-ci
    capabilities:
      external_practice_intake: native
      runtime_target_health: native
      loop_readiness: native
      runtime_binding_comparison: r2-policy-ready
      exact_release_source_set_comparison: r2-policy-ready
      runtime_portability_certifier: native-fail-closed
      runtime_portability_certifier_readiness: certifier-ready-real-evidence-pending
      execution_receipt_consumption: source-set-v2-ready
      r2_real_provider_evidence: pending-external-evidence
      terminal_replaceability: blocked-until-r2-real-provider-evidence
      production_runtime: unsupported-by-design
    decision: candidate-evaluation-lab

  engineering_fact_sources:
    candidates: [git, ci, hil, artifact-store]
    authority: source-system
    decision: stable-principle

rules:
  no_poc_evidence_no_pass: true
  selected_integration_does_not_freeze_architecture: true
  provider_failure_is_not_pass: true
  fallback_exit_plan_required_before_default: true
  contract_ci_success_does_not_imply_operational_readiness: true
  runtime_binding_is_not_control_plane: true
  assurance_binding_is_not_control_plane: true
  assurance_provider_receipt_is_input_evidence_only: true
  provider_receipt_ready_does_not_imply_domain_review_pass: true
  human_or_other_provider_path_must_remain_valid: true
  immutable_adk_release_required: true
  exact_source_set_identity_required: true
  runtime_distribution_identity_required_when_executed: true
  monolithic_runtime_bundle_not_required_identity: true
  formal_mode_requires_exact_pinned_knowledge: true
  terminal_replaceability_requires_r2_real_provider_substitution: true
  r1_binding_conformance_is_not_terminal_replaceability: true
  r2_certifier_readiness_does_not_imply_terminal_replaceability: true
  governed_knowledge_route_registration_does_not_imply_real_reuse: true
  knowledge_closed_loop_requires_real_reuse_evidence: true
  single_real_reuse_does_not_imply_provider_qualification: true
  capability_projection_must_reference_cross_repo_lock_identity: true
  pin_freshness_does_not_imply_compatibility: true
  pin_promotion_requires_checkout_verification: true
