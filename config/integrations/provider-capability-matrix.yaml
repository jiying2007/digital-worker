    decision: candidate-evaluation-lab

  engineering_fact_sources:
    candidates: [git, ci, hil, artifact-store]
    authority: source-system
    decision: stable-principle

rules:
  no_poc_evidence_no_pass: true
  selected_integration_does_not_freeze_architecture: true
  provider_failure_is_not_pass: true
  fallback_exit_plan_required_before_default: true
  contract_ci_success_does_not_imply_operational_readiness: true
  runtime_binding_is_not_control_plane: true
  immutable_adk_release_required: true
  exact_source_set_identity_required: true
  runtime_distribution_identity_required_when_executed: true
  monolithic_runtime_bundle_not_required_identity: true
  formal_mode_requires_exact_pinned_knowledge: true
  pin_freshness_does_not_imply_compatibility: true
  pin_promotion_requires_checkout_verification: true
