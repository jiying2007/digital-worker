      codex:
        repository: jiying2007/codex
        pinned_commit: eed4244e5ce15101210132a0680b620cc4dabfe7
        runtime_target: codex-cli
        contract: manifests/integrations/digital-worker-runtime-binding.json
        contract_version: '2.0'
