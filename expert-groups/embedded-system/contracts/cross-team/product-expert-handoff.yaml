schema_version: 1
version: 0.4.0
id: product-to-embedded-technical-review
status: implemented-baseline

purpose: >-
  Define a machine-readable handoff from the Product Expert Team technical-feasibility stage
  to the Embedded System Expert Team without allowing either team to silently assume the other's authority.

request:
  schema: ../../../../schemas/technical-review-request.v1.schema.json
  producer: product-expert-team
  consumer: embedded-system-team-lead
  entry_task_type: technical_feasibility_review
  workflow_mode: review_only

response:
  schema: ../../../../schemas/embedded-feasibility-review.v1.schema.json
  producer: embedded-system-team-lead
  consumer: product-expert-team

responsibility_boundary:
  product_expert_team:
    owns:
      - product_problem_and_user_value
      - requirement_priority
      - product_scope
      - acceptance_intent
  embedded_system_team:
    owns:
      - embedded_technical_feasibility
      - architecture_and_platform_impact
      - embedded_software_scope
      - engineering_risks
      - verification_strategy
  neither_team_may_auto_approve:
      - product_final_go_no_go
      - production_release
      - irreversible_device_action

invariants:
  - request_and_response_work_item_id_match
  - requirements_are_referenced_not_reinvented
  - assumptions_are_explicit
  - material_claims_have_evidence_or_are_marked_unverified
  - insufficient_evidence_returns_INSUFFICIENT_EVIDENCE_not_a_guess
  - feasibility_response_does_not_modify_product_priority
  - product_team_does_not_override_embedded_verification_status

reflow:
  missing_product_input: return_to_product_expert_team
  missing_embedded_evidence: keep_review_open_or_return_INSUFFICIENT_EVIDENCE
  requirement_change_after_review: create_new_review_revision
