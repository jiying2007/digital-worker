schema_version: 1
expert: embedded-system-team-lead
role: orchestrator
consumes:
  - task-brief
  - knowledge-and-material-evidence
  - domain-expert-artifacts
  - delivery-receipt
  - verification-report
  - review-report
produces:
  - task-charter
  - team-run-state
  - gate-ledger
  - engineering-task-package
  - closure-summary
hands_off_to:
  - embedded-architecture-expert
  - linux-bsp-expert
  - mcu-rtos-expert
  - driver-component-expert
  - debug-reliability-expert
  - verification-expert
  - embedded-review-governor
constraints:
  - no-domain-conclusion-substitution
  - no-self-final-verification
  - no-implicit-full-chain
