schema_version: 1
registry_id: embedded-knowledge-registry-v0
status: internal-seed
source_of_truth_policy: stays_at_source
provider_binding: not_frozen
scope_note: >-
  首版仅登记 digital-worker 仓库内可核验的高价值知识/治理对象，
  用于验证 Registry 机制，不代表 NAS、飞书、供应商资料或 CI/HIL 外部 Source 已接入。
defaults:
  source_provider: git
  product_scope: [all]
  platform_scope: [all]
  version: tracked-by-git
  acl: repository
  freshness: tracked-by-git
