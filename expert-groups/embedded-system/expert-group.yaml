schema_version: 1
id: embedded-system
name: 嵌入式系统专家团
version: 0.7.0
status: architecture-frozen
implementation_status: pilot-operations-ready
architecture_model: provider-neutral
owner_domain: 研发中心/嵌入式系统软件

semantic_lifecycle:
  status: legacy-compatibility-surface
  target_domain: ../../domains/edge-foundation/domain.yaml
  target_adr: ../../docs/adr/ADR-004-edge-foundation-digital-responsibility-architecture.md
  compatibility_mapping: ../../domains/edge-foundation/compatibility/embedded-1plus7-mapping.yaml
  migration_phase: phase-2-dual-evaluation
  shadow_routing: ../../domains/edge-foundation/routing-shadow.yaml
  legacy_machine_contract_preserved: true
  canonical_target_responsibility_model: edge-foundation
  canonical_routing_switched: false
  no_new_legacy_expert_roles: true
  direct_removal_forbidden: true

mission:
  - embedded-software-technical-analysis
  - architecture-and-feasibility
  - linux-bsp-and-kernel
  - mcu-rtos-and-baremetal
  - driver-and-component-engineering
  - debugging-and-reliability
  - verification-and-hil
  - independent-review
  - release-and-field-engineering

ssot:
  repository: jiying2007/digital-worker
  external_repositories: reference_only
  review_reference: ../../嵌入式系统专家团-核心参考/README.md
  provider_binding: not_frozen

upstream_contracts:
  - ../../研发中心AI数字员工研发流程规划.md
  - ../../docs/adr/ADR-001-workbuddy-codex-integration-boundary.md
  - ../../docs/adr/ADR-002-embedded-system-expert-team-architecture.md
  - ../../docs/adr/ADR-003-provider-neutral-ai-rd-target-architecture.md
  - ../../docs/adr/ADR-004-edge-foundation-digital-responsibility-architecture.md
  - ../../domains/edge-foundation/domain.yaml

shared_contracts:
  task_brief: ../../schemas/task-brief.v1.schema.json
  delivery_receipt: ../../schemas/delivery-receipt.v1.schema.json
  hil_evidence: ../../schemas/hil-evidence.v1.schema.json
  engineering_handoff: contracts/engineering-handoff.yaml
  product_technical_review_request: ../../schemas/technical-review-request.v1.schema.json
  embedded_feasibility_review: ../../schemas/embedded-feasibility-review.v1.schema.json
  pilot_run: ../../schemas/pilot-run.v1.schema.json
  pilot_result: ../../schemas/pilot-result.v1.schema.json
  pilot_metrics: ../../schemas/pilot-metrics.v1.schema.json
  pilot_evidence_bundle: ../../schemas/pilot-evidence-bundle.v1.schema.json
  pilot_status: ../../schemas/pilot-status.v1.schema.json

authority_index: governance/authority-index.md
done_definition: governance/done-definition.md

team_lead:
  id: embedded-system-team-lead
  role: orchestrator
  definition: agents/embedded-system-team-lead.md
  contract: contracts/experts/team-lead.io.yaml
  may_self_approve_final_verification: false

experts:
  - {id: embedded-architecture-expert, domain: architecture, definition: agents/embedded-architecture-expert.md, contract: contracts/experts/architecture.io.yaml}
  - {id: linux-bsp-expert, domain: linux-bsp, definition: agents/linux-bsp-expert.md, contract: contracts/experts/linux-bsp.io.yaml}
  - {id: mcu-rtos-expert, domain: mcu-rtos, definition: agents/mcu-rtos-expert.md, contract: contracts/experts/mcu-rtos.io.yaml}
  - {id: driver-component-expert, domain: driver-component, definition: agents/driver-component-expert.md, contract: contracts/experts/driver-component.io.yaml}
  - {id: debug-reliability-expert, domain: debug-reliability, definition: agents/debug-reliability-expert.md, contract: contracts/experts/debug-reliability.io.yaml}
  - {id: verification-expert, domain: verification, definition: agents/verification-expert.md, contract: contracts/experts/verification.io.yaml}
  - {id: embedded-review-governor, domain: independent-review, definition: agents/embedded-review-governor.md, contract: contracts/experts/review-governor.io.yaml}

workflow:
  task_modes: config/task-modes.yaml
  state_machine: config/workflow.yaml
  gate_policy: config/gate-policy.yaml
  material_requirements: config/material-requirements.yaml
  action_policy: config/action-policy.yaml
  skill_registry: config/p0-skills.yaml
  default_mode: null
  require_task_classification: true
  allow_implicit_full_chain: false

core_gates: [gate.k, gate.m, gate.0, gate.t, gate.e, gate.v, gate.r, gate.c]

governance_artifacts:
  - schemas/evidence-ref.schema.json
  - schemas/team-run-state.schema.json
  - schemas/gate-ledger.schema.json
  - schemas/task-charter.schema.json
  - schemas/material-manifest.schema.json
  - schemas/knowledge-readiness.schema.json
  - schemas/routing-decision.schema.json
  - schemas/technical-analysis.schema.json
  - schemas/hypothesis-registry.schema.json
  - schemas/technical-decision.schema.json
  - schemas/engineering-task-package.schema.json
  - schemas/verification-report.schema.json
  - schemas/review-report.schema.json
  - schemas/deliverable-manifest.schema.json
  - schemas/golden-case.schema.json

evidence:
  required_for_material_claims: true
  source_of_truth_stays_at_source: true
  debug_fact_states: [observed, inferred, confirmed]
  confidence_levels: [C0, C1, C2, C3, C4, C5, C6]

verification_layers: [implemented, host_verified, cross_build_verified, sil_verified, device_verified, hil_verified, release_verified]
forbid_cross_layer_inference: true

independence:
  implementation_may_self_approve_final_verification: false
  final_review_role: embedded-review-governor

autonomy:
  default_allowed: [A0_READ, A1_ANALYZE, A2_GENERATE]
  controlled_execution: [A3_MODIFY_WORKTREE, A4_BUILD_TEST]
  authorization_required: [A5_DEVICE_READ]
  human_approval_required: [A6_DEVICE_WRITE, A7_RELEASE]

engineering_runtime:
  execution_role: engineer-plus-engineering-agent
  provider_selection: not_frozen
  provider_examples: [codex, claude_code, ide_agent, internal_agent, other]
  runtime_must_preserve_contract_semantics: true
  interaction_provider_direct_control: forbidden_by_default

validation:
  script: ../../scripts/validate_embedded_assets.py
  target_architecture_validator: ../../scripts/validate_edge_foundation_architecture.py
  shadow_routing_evaluator: ../../scripts/evaluate_edge_foundation_shadow.py
  pilot_operations_validator: ../../scripts/validate_pilot_operations.py
  pilot_evaluator: ../../scripts/evaluate_embedded_pilot.py
  pilot_cli: ../../scripts/embedded_pilot.py
  workflow: ../../.github/workflows/embedded-expert-contracts.yml
  positive_fixtures_required: true
  negative_fixtures_required: true
  golden_cases: tests/golden-cases.yaml

pilot:
  plan: pilot/pilot-plan.yaml
  artifact_requirements: pilot/artifact-requirements.yaml
  runbook: ../../docs/runbooks/embedded-pilot.md
  local_run_root: pilot/runs
  required_tracks: [debug, feature, review_release]
  real_run_exact_base_commit_required: true
  completed_run_evidence_bundle_required: true
  synthetic_results_count_for_productionization: false
  auto_production_ready: false

knowledge:
  source_of_truth_policy: stays_at_source
  access_model: federated_or_hybrid
  provider_selection: not_frozen
  knowledge_gateway_status: conceptual
  context_broker_status: conceptual
  source_classes: [collaboration_docs, nas_documents, git, ci_hil_evidence, artifact_store, other]
  local_knowledge_scope: [methodology, checklists, templates, terminology, source-registry, static-engineering-rules, evaluation-fixtures]
  forbid_parallel_manual_canonical_copy: true
  require_source_version_acl_provenance: true

cross_team:
  product_expert_team:
    contract: contracts/cross-team/product-expert-handoff.yaml
    input: technical-review-request
    output: embedded-feasibility-review
  edge_foundation_team:
    target_domain_contract: ../../domains/edge-foundation/domain.yaml
    compatibility_mapping: ../../domains/edge-foundation/compatibility/embedded-1plus7-mapping.yaml
    shadow_routing: ../../domains/edge-foundation/routing-shadow.yaml
    ownership_contract: contracts/cross-team/edge-foundation-ownership.yaml
    ownership_model: [OWN, SHARED, CONSUME, PROVIDE, OUT_OF_SCOPE]
    current_status: dual-evaluation
    require_ownership_map_before_duplicate_capability: true

evaluation:
  golden_cases_required: true
  primary_metrics: [routing_accuracy, evidence_coverage, unsupported_claim_rate, correct_block_rate, incorrect_pass_rate, root_cause_accuracy, verification_completeness, human_correction_rate, audit_trace_completeness]
  safety_priority_metric: incorrect_pass_rate

next_stage:
  - dual-evaluate-legacy-routing-and-target-semantics
  - bind-shadow-semantics-to-real-pilot-evidence
  - knowledge-source-inventory-and-poc
  - multi-runtime-real-pilot
  - edge-foundation-ownership-resolution
  - canonical-routing-switch-after-evidence
  - productionization-review-after-pilot-evidence
