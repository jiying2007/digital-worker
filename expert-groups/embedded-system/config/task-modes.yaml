schema_version: 1
version: 0.1.0
status: architecture-frozen

workflow_modes:
  full_chain:
    description: 跨多专业、从技术分析到验证和收口的完整链路
  short_chain:
    description: 已有产品/平台上的常规功能、驱动、组件或优化
  diagnostic_chain:
    description: 缺陷、长稳、现场问题的证据驱动诊断闭环
  bringup_chain:
    description: 新板、新SoC、新BSP或平台Bring-up
  review_only:
    description: 技术可行性、架构或代码审查，不自动扩展为实施
  release_chain:
    description: Release/OTA/rollback/provenance/readiness
  single_expert:
    description: 边界清晰、无需跨专家判断的单领域分析

routing:
  feature_development:
    default_mode: short_chain
    allowed_modes: [short_chain, full_chain]
    primary_experts: [embedded-architecture-expert, driver-component-expert, mcu-rtos-expert, linux-bsp-expert]
  defect_debugging:
    default_mode: diagnostic_chain
    allowed_modes: [diagnostic_chain]
    primary_experts: [debug-reliability-expert]
  architecture_design:
    default_mode: short_chain
    allowed_modes: [short_chain, review_only]
    primary_experts: [embedded-architecture-expert]
  technical_feasibility_review:
    default_mode: review_only
    allowed_modes: [review_only]
    primary_experts: [embedded-architecture-expert]
  platform_bringup:
    default_mode: bringup_chain
    allowed_modes: [bringup_chain]
    primary_experts: [linux-bsp-expert, mcu-rtos-expert, driver-component-expert]
  bsp_porting:
    default_mode: bringup_chain
    allowed_modes: [bringup_chain, short_chain]
    primary_experts: [linux-bsp-expert]
  driver_development:
    default_mode: short_chain
    allowed_modes: [short_chain]
    primary_experts: [driver-component-expert, linux-bsp-expert]
  component_development:
    default_mode: short_chain
    allowed_modes: [short_chain]
    primary_experts: [driver-component-expert, embedded-architecture-expert]
  mcu_firmware_development:
    default_mode: short_chain
    allowed_modes: [short_chain, full_chain]
    primary_experts: [mcu-rtos-expert]
  performance_optimization:
    default_mode: short_chain
    allowed_modes: [short_chain, diagnostic_chain]
    primary_experts: [debug-reliability-expert, embedded-architecture-expert]
  stability_reliability:
    default_mode: diagnostic_chain
    allowed_modes: [diagnostic_chain]
    primary_experts: [debug-reliability-expert, verification-expert]
  code_review:
    default_mode: review_only
    allowed_modes: [review_only]
    primary_experts: [embedded-review-governor]
  release_ota:
    default_mode: release_chain
    allowed_modes: [release_chain]
    primary_experts: [verification-expert, embedded-review-governor]
  field_incident:
    default_mode: diagnostic_chain
    allowed_modes: [diagnostic_chain]
    primary_experts: [debug-reliability-expert, verification-expert]

rules:
  require_task_type_before_execution: true
  implicit_full_chain_forbidden: true
  mode_expansion_requires_team_lead_decision: true
  review_only_must_not_implicitly_modify_code: true
  diagnostic_chain_requires_hypothesis_registry: true
  release_chain_requires_human_release_gate: true
