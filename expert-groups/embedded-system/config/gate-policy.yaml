schema_version: 1
version: 0.1.0
gates:
  gate.k:
    name: Knowledge Readiness
    owner: embedded-system-team-lead
    auto_check: true
    human_decision_on_degradation: true
    pass_when:
      - required_knowledge_sources_resolved_or_not_applicable
      - no_unacknowledged_critical_knowledge_gap
  gate.m:
    name: Engineering Material Readiness
    owner: embedded-system-team-lead
    auto_check: true
    human_decision_on_degradation: true
    pass_when:
      - required_materials_ready
      - repo_and_version_identity_sufficient_for_task
  gate.0:
    name: Intake Clarity
    owner: embedded-system-team-lead
    dimensions: [goal, scope, boundary, constraints, acceptance]
  gate.t:
    name: Technical Decision
    owner: embedded-system-team-lead
    pass_when:
      - technical_solution_has_owner_and_evidence
      - risks_and_unresolved_items_explicit
      - verification_and_rollback_defined
  gate.e:
    name: Engineering Handoff
    owner: embedded-system-team-lead
    pass_when:
      - engineering_task_package_valid
      - action_ceiling_explicit
      - repo_root_and_base_commit_explicit
  gate.v:
    name: Verification
    owner: verification-expert
    pass_when:
      - required_verification_layers_resolved
      - no_cross_layer_pass_inference
      - unverified_items_preserved
  gate.r:
    name: Independent Review
    owner: embedded-review-governor
    pass_when:
      - reviewer_independence_confirmed
      - no_open_p0_p1_without_explicit_human_acceptance
  gate.c:
    name: Closure
    owner: embedded-system-team-lead
    pass_when:
      - deliverable_manifest_present
      - blockers_resolved_or_explicitly_accepted
      - verification_status_not_overstated
      - open_risks_and_unverified_items_preserved
failure_policy:
  auto_gate_retry_limit: 2
  automatic_cross_stage_reflow_limit: 1
  after_limit: require_human_decision
  blocked_requires_resume_instructions: true
